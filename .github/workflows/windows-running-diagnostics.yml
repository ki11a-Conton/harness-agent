name: inspect Windows running-status regression
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-running-diagnostics.yml"
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '38777915854'
          name: test-report-windows-latest
          path: original/windows
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '38777915854'
          name: n6-real-formal-windows-latest-f2eb7f87f09558ce172c83086112ddccaf0b4059-38777915854-attempt-1
          path: original/formal
      - name: Project original resource failures without rerunning tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import { join, basename } from 'node:path';
          import { gzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const logs = [];
          async function walk(path) { for (const entry of await readdir(path,{withFileTypes:true})) {
            const file = join(path,entry.name);
            if (entry.isDirectory()) await walk(file);
            else if (['test-report.log','test.log'].includes(basename(file))) logs.push(file);
          } }
          await walk('original');
          if (logs.length < 2) throw new Error('Expected original Windows unit and formal raw test logs');
          const records = [];
          for (const file of logs) {
            const bytes = await readFile(file), lines = bytes.toString('utf8').replace(/\x1b\[[0-9;]*m/g,'').split('\n');
            const excerpts = [];
            for (let i=0;i<lines.length;i++) if (/^ FAIL |ENOTEMPTY|HARNESS_DATA_DIR_IN_USE|DataDirLeaseError/.test(lines[i]))
              excerpts.push({line:i+1,text:lines.slice(Math.max(0,i-2),Math.min(lines.length,i+30)).join('\n')});
            records.push({file,rawBytes:bytes.length,rawSha256:createHash('sha256').update(bytes).digest('hex'),
              summary:lines.filter(line => /Test Files |Tests  |Duration /.test(line)),excerpts});
          }
          const record = {runId:'38777915854',sourceSha:'f2eb7f87f09558ce172c83086112ddccaf0b4059',records,
            limitation:'Bounded projections of existing original Windows test logs. No rerun or acceptance claim.'};
          await writeFile('resource-failures.json',JSON.stringify(record,null,2));
          const data=gzipSync(Buffer.from(JSON.stringify(record))).toString('base64'),total=Math.ceil(data.length/3500);
          if(total>8)throw new Error('Projection exceeds annotation budget');
          for(let index=0;index<total;index++)console.log('::notice title=Windows resource failure chunk::'+JSON.stringify({index,total,encoding:'gzip+base64',data:data.slice(index*3500,(index+1)*3500)}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-windows-resource-failures-${{ github.run_id }}
          path: resource-failures.json
          if-no-files-found: error
