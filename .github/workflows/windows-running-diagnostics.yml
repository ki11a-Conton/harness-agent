name: inspect Windows running-status regression
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-running-diagnostics.yml"
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '38776733403'
          name: windows-status-diagnostics-38776733403
          path: diagnostic
      - name: Recover a bounded receipt from existing Windows diagnostic bytes without rerunning tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { gzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const bytes = await readFile('diagnostic/full-suite.log');
          const lines = bytes.toString('utf8').replace(/\x1b\[[0-9;]*m/g, '').split('\n');
          const original = JSON.parse(await readFile('diagnostic/result.json', 'utf8')).find(row => row.profile === 'full-suite');
          const cases = new Map(); let current;
          for (const line of lines) {
            const match = /stderr \| .*session-running-status.regressions.test.ts > (.*)/.exec(line);
            if (match) { current = match[1]; if (!cases.has(current)) cases.set(current, []); }
            const phase = /WINDOWS_STATUS_PHASE (\d+) (.*)/.exec(line);
            if (phase && current) cases.get(current).push({ atMs: Number(phase[1]), phase: phase[2] });
          }
          const failures = [];
          for (let i = 0; i < lines.length; i++) if (/^ FAIL |Test timed out|body-error/.test(lines[i]))
            failures.push({ line: i + 1, text: lines.slice(Math.max(0,i-1),Math.min(lines.length,i+15)).join('\n') });
          const record = { originalRun: '38776733403', sourceSha: original.sourceSha, exitCode: original.exitCode,
            signal: original.signal, sourceTreeDirtyForDiagnosis: true,
            rawBytes: bytes.length, rawSha256: createHash('sha256').update(bytes).digest('hex'),
            summary: lines.filter(line => /Test Files |Tests  |Duration |session-running-status.regressions.test.ts \(30 tests/.test(line)),
            cases: [...cases].map(([name,phases]) => ({ name, elapsedMs: phases.length > 1 ? phases.at(-1).atMs-phases[0].atMs : null,
              lastPhase: phases.at(-1), errors: phases.filter(p => p.phase.includes('error')) })),
            failures, limitation: 'Existing instrumented Windows log projection only; no test rerun and no acceptance PASS.' };
          await writeFile('diagnostic/bounded-full-receipt.json',JSON.stringify(record,null,2));
          const data = gzipSync(Buffer.from(JSON.stringify(record))).toString('base64');
          const total = Math.ceil(data.length/3500);
          if (total > 8) throw new Error('Bounded receipt exceeds annotation budget');
          for (let index = 0; index < total; index++) console.log('::notice title=Repeated Windows full receipt chunk::'+
            JSON.stringify({index,total,encoding:'gzip+base64',data:data.slice(index*3500,(index+1)*3500)}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-status-bounded-receipt-${{ github.run_id }}
          path: diagnostic/bounded-full-receipt.json
          if-no-files-found: error
