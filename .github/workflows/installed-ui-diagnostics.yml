name: inspect installed UI evidence
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the original failed UI workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const { RUN_ID, SOURCE_SHA, REPOSITORY, GH_TOKEN } = process.env;
          assert.match(RUN_ID, /^\d+$/); assert.match(SOURCE_SHA, /^[a-f0-9]{40}$/);
          assert.equal(REPOSITORY, 'ki11a-Conton/harness-agent');
          const response=await fetch(`https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}`,{headers:{Authorization:`Bearer ${GH_TOKEN}`,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(30000)});
          assert.equal(response.status,200);const run=await response.json();
          assert.equal(run.head_sha,SOURCE_SHA);assert.equal(run.head_branch,'main');
          assert.equal(run.path,'.github/workflows/deepseek-ui-installed.yml');assert.equal(run.status,'completed');assert.equal(run.conclusion,'failure');
          console.log(JSON.stringify({runId:run.id,sourceSha:run.head_sha,conclusion:run.conclusion}));
          NODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: deepseek-installed-ubuntu-latest-${{ inputs.source_sha }}-${{ inputs.run_id }}
          path: evidence
      - name: Project original partial daily records without rerunning the application
        env:
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { gzipSync } from 'node:zlib';
          const digest=b=>createHash('sha256').update(b).digest('hex');
          const files=await readdir('evidence/daily'),records=[];
          for(const file of files.filter(f=>/^(desktop|mobile|narrow)-.*\.json$/.test(f)).sort()){
            const bytes=await readFile('evidence/daily/'+file),item=JSON.parse(bytes);
            records.push({file,rawBytes:bytes.length,rawSha256:digest(bytes),name:item.name,viewport:item.viewport,status:item.status,checks:item.checks?.length,failure:item.failure,errors:item.errors,
              ...(item.status==='PASS'?{}:{visibleText:item.visibleText?.slice(-8000),calls:item.calls?.slice(-12),results:item.results?.filter(x=>x.ok===false),sockets:item.sockets,externalRequests:item.externalRequests})});
          }
          async function textRecord(path,tail){try{const bytes=await readFile(path);return{path,rawBytes:bytes.length,rawSha256:digest(bytes),tail:bytes.toString('utf8').slice(-tail)}}catch(error){return{path,error:error.message}}}
          const daily=await textRecord('evidence/daily.log',16000),stderr=await textRecord('evidence/host-stderr.log',3000);
          let model=[];try{const bytes=await readFile('evidence/daily/fixture/evidence/requests.jsonl');model=bytes.toString('utf8').trim().split('\n').filter(Boolean).slice(-4).map(line=>{const r=JSON.parse(line);return{call:r.call,model:r.model,user:r.messages.filter(x=>x.role==='user').slice(-1).map(x=>String(x.content).slice(-1500))}})}catch{}
          const data=gzipSync(Buffer.from(JSON.stringify({runId:process.env.RUN_ID,sourceSha:process.env.SOURCE_SHA,scope:'Original failed artifact only; no rerun, no acceptance claim',records,daily,stderr,model,files}))).toString('base64');
          const size=3500,total=Math.ceil(data.length/size);if(total>7)throw Error('Diagnostic projection exceeds bounded annotation budget');
          for(let index=0;index<total;index++)console.log('::notice title=Original UI partial evidence chunk::'+JSON.stringify({index,total,encoding:'gzip+base64',data:data.slice(index*size,(index+1)*size)}));
          NODE
