name: inspect installed UI evidence

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Installed UI workflow run whose original evidence should be inspected
        required: true
        type: string
      source_sha:
        description: Exact source SHA of the original workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the original workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const { RUN_ID, SOURCE_SHA, REPOSITORY, GH_TOKEN } = process.env;
          assert.match(RUN_ID, /^\d+$/); assert.match(SOURCE_SHA, /^[a-f0-9]{40}$/);
          assert.equal(REPOSITORY, 'ki11a-Conton/harness-agent');
          const response = await fetch(`https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}`, {
            headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            redirect: 'error', signal: AbortSignal.timeout(30000),
          });
          assert.equal(response.status, 200);
          const run = await response.json();
          assert.equal(run.head_sha, SOURCE_SHA); assert.equal(run.head_branch, 'main');
          assert.equal(run.path, '.github/workflows/deepseek-ui-installed.yml');
          assert.equal(run.status, 'completed');
          console.log(JSON.stringify({ runId: run.id, sourceSha: run.head_sha, conclusion: run.conclusion }));
          NODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: deepseek-installed-windows-latest-${{ inputs.source_sha }}-${{ inputs.run_id }}
          path: evidence
      - name: Expose original composer failure without rerunning the application
        env:
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { gzipSync } from 'node:zlib';
          const root = 'evidence/';
          const files = {};
          for (const path of ['composer-mode/result.json', 'composer-mode/failure-text.txt', 'composer-mode.log', 'host-stderr.log']) {
            const bytes = await readFile(root + path);
            files[path] = { bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'),
              content: path.endsWith('.json') ? JSON.parse(bytes) : bytes.toString('utf8').slice(-24000) };
          }
          try {
            const bytes = await readFile(root + 'composer-mode/failure.png');
            files['composer-mode/failure.png'] = { bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'),
              ...(bytes.length <= 70000 ? { encoding: 'base64', data: bytes.toString('base64') } : {}) };
          } catch (error) { if (error.code !== 'ENOENT') throw error; }
          const record = { schemaVersion: 1, runId: process.env.RUN_ID, originalSourceSha: process.env.SOURCE_SHA,
            purpose: 'Original failed composer artifacts only: no application rerun, no changed verdict', files };
          const data = gzipSync(Buffer.from(JSON.stringify(record))).toString('base64');
          const size = 3200, total = Math.ceil(data.length / size);
          if (total > 40) throw new Error('Diagnostic projection exceeds bounded annotation budget');
          for (let index = 0; index < total; index++) console.log(`::notice title=Original composer evidence ${index + 1}/${total}::` +
            JSON.stringify({ encoding: 'gzip+base64', index, total, data: data.slice(index * size, (index + 1) * size) }));
          NODE
