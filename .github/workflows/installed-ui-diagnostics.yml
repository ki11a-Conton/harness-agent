name: inspect installed UI evidence

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Installed UI workflow run whose original evidence should be inspected
        required: true
        type: string
      source_sha:
        description: Exact source SHA of the original workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the original workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const { RUN_ID, SOURCE_SHA, REPOSITORY, GH_TOKEN } = process.env;
          assert.match(RUN_ID, /^\d+$/); assert.match(SOURCE_SHA, /^[a-f0-9]{40}$/);
          assert.equal(REPOSITORY, 'ki11a-Conton/harness-agent');
          const response = await fetch(`https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}`, {
            headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            redirect: 'error', signal: AbortSignal.timeout(30000),
          });
          assert.equal(response.status, 200);
          const run = await response.json();
          assert.equal(run.head_sha, SOURCE_SHA); assert.equal(run.head_branch, 'main');
          assert.equal(run.path, '.github/workflows/ci.yml');
          assert.equal(run.run_attempt, 1);
          assert.equal(run.status, 'completed');
          console.log(JSON.stringify({ runId: run.id, sourceSha: run.head_sha, conclusion: run.conclusion }));
          NODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: test-report-windows-latest
          path: evidence
      - name: Expose original unit failure without rerunning tests
        env:
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { gzipSync } from 'node:zlib';
          const bytes = await readFile('evidence/test-report.log');
          if (bytes.length > 10 * 1024 * 1024) throw new Error('Original log exceeds forensic bound');
          const text = bytes.toString('utf8').replace(/\u001b\[[0-9;]*m/g, '');
          const at = text.lastIndexOf('FAIL  packages/harness/src/managed-commands.integration.test.ts');
          if (at < 0) throw new Error('Named original managed command failure missing');
          const excerpt = text.slice(Math.max(0, at - 200), at + 12000);
          const record = { originalRunId: process.env.RUN_ID, originalSourceSha: process.env.SOURCE_SHA,
            originalLogBytes: bytes.length, originalLogSha256: createHash('sha256').update(bytes).digest('hex'),
            purpose: 'Original failed unit log excerpt; no test rerun or verdict change', excerpt };
          const data = gzipSync(Buffer.from(JSON.stringify(record))).toString('base64');
          const size = 3200, total = Math.ceil(data.length / size);
          if (total > 7) throw new Error('Forensic projection exceeds per-step annotation budget');
          for (let index = 0; index < total; index++) console.log(`::notice title=Original managed unit evidence ${index + 1}/${total}::` +
            JSON.stringify({ encoding: 'gzip+base64', index, total, data: data.slice(index * size, (index + 1) * size) }));
          NODE
