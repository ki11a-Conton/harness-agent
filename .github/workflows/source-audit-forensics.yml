name: source audit historical failure forensics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-audit-forensics.yml'
      - 'scripts/ci/formal-failure-forensics.mjs'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact original failed job identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://api.github.com/repos/ki11a-Conton/harness-agent/actions/jobs/122680647869', {
            headers: {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json'},
            signal: AbortSignal.timeout(30000)
          });
          assert.equal(response.status, 200);
          const job = await response.json();
          assert.equal(job.head_sha, '7f44f7869054178f09b5ccc8505cc3f899fe579a');
          assert.equal(job.run_id, 40647821978); assert.equal(job.conclusion, 'failure');
          console.log(JSON.stringify({jobId:job.id, sourceSha:job.head_sha,runId:job.run_id,conclusion:job.conclusion}));
          NODE
      - name: Recover the exact failed Windows formal bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '40647821978'
          name: n6-real-formal-windows-latest-7f44f7869054178f09b5ccc8505cc3f899fe579a-40647821978-attempt-1
          path: .ci/historical-formal-failure
      - name: Publish original command receipt and failure excerpt
        run: node scripts/ci/formal-failure-forensics.mjs .ci/historical-formal-failure
