# Q-13 — CI Pipeline.
#
# Plan.md Q-13 requirement: at minimum `install · typecheck · test · build ·
# benchmark smoke`. The benchmark smoke must run WITHOUT a paid model provider
# for ordinary PR checks — it uses the CLI's `--allow-stub` stub/fake provider,
# which records MODEL_ERROR honestly and still exercises the full harness path
# (case loading, workspace setup, model loop, termination, report freeze).
#
# P10-6 (cross-platform promotion gate): the verify job runs on BOTH
# ubuntu-latest AND windows-latest. A harness candidate that touches
# path/filesystem/process/store policy is only promotable when both platforms
# are green — this matrix IS that gate.
#
# P12-5 (capability matrix becomes a CI artifact): every platform run uploads
#   - CAPABILITY_MATRIX.md / CAPABILITY_MATRIX.json (generated by
#     `agent audit --out`, from real wiring evidence — never documentation)
#   - the benchmark smoke report (.ci/bench-smoke)
#   - the raw test report log (.ci/test-report.log)
# as workflow artifacts.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · test · build · benchmark-smoke · audit
    strategy:
      fail-fast: false
      matrix:
        # P10-6: promotion of path/filesystem/process/store-sensitive changes
        # requires BOTH platforms green. Keep both entries always — a silent
        # single-platform gate would not be a gate.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Never let an absent key silently flip a job into "no-op success".
      OPENAI_API_KEY: ""
      # E4-R24 (F03/F04): NAME this suite run and point committed observation
      # evidence into the workspace. The suite then runs under the final-result
      # reporter, which publishes committed (`runStatus: passed`) rows ONLY from
      # the framework's final test states (assertions + afterEach/afterAll).
      # A failed test leaves no passed rows behind, and a rerun writes to its
      # OWN run file — an old green run can never mask a current failure. The
      # INDEPENDENT strict audit below reads exactly this run.
      E2E_OBSERVATION_EVIDENCE_DIR: .ci/observation-evidence
      E2E_OBSERVATION_RUN_ID: e4-r24-${{ matrix.os }}-${{ github.run_id }}
      # E4-R40 (K01): where a FAILED e4-09 run drops its attribution bundle.
      # Recorded relative to the repo root (CI cwd); `.ci/` is git-ignored so
      # this never dirties the working tree the sentinel inspects.
      E4_09_DIAG_DIR: .ci/diagnostics
      # E4-R60 (G60): where the R55 PARENT VERIFIER drops the logs, raw report
      # and diagnostic bundle tree of a child run it judged UNDECIDABLE. The
      # parent preserves this BEFORE releasing the run's temp roots, so it is
      # separate from (and additional to) the e4-09 hook above. Also `.ci/`,
      # for the same clean-tree reason.
      E4_R55_PARENT_DIAG_DIR: .ci/r55-parent-diagnostics
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        # bash on both runners (Git Bash ships with windows-latest); the single
        # command propagates its exit code while the log is kept for P12-5.
        # P37-13: tee to console so GitHub job logs show failure details even
        # when the redirection to file hides them from the Actions UI.
        shell: bash
        run: |
          mkdir -p .ci
          pnpm test 2>&1 | tee .ci/test-report.log

      # -----------------------------------------------------------------------
      # N3 DIAGNOSTICS — publish the failing test names into the PUBLIC job
      # summary and as check annotations, so a cross-platform regression can be
      # read without an authenticated log download.
      #
      # The diagnostic itself is a NODE script invoked with `node`, with no
      # `shell:` key at all, so it behaves the same under bash and under pwsh.
      # That is required rather than cosmetic: `r97-closed-loop.test.ts`
      # ("uses NO bash step in the closed-loop job") FAILS the suite if any step
      # in that job names `shell: bash`, and it caught an earlier revision of
      # this diagnostic (measured locally: 1 failed, 23 passed in
      # `r97-closed-loop.test.ts`). The `verify` job may use bash, but the same
      # Node script is used in both places so the two platforms cannot diverge.
      # -----------------------------------------------------------------------
      - name: Publish failing test names to the public job summary
        if: failure()
        continue-on-error: true
        run: node scripts/e4/r97-ci-diagnostics.mjs --label verify --log .ci/test-report.log

      - name: Build
        run: pnpm build

      # E4-R24 (F03/F04): independent STRICT usage audit over the suite's named
      # run. The strict verdict is rendered by its own process AFTER the final
      # results are committed — a test never writes its own success and then
      # asserts on it in the same body. --strict WITHOUT --run fails by design
      # (no global-history fallback); here the run IS named, so the only way
      # this step passes is: the framework's final results + committed rows +
      # exact testedSourceSha match + testName declared in the test file source.
      # A red audit fails the job — a green test gate alone cannot certify
      # release-grade observation.
      - name: Strict usage audit of the named run (E4-R24 independent stage)
        shell: bash
        run: |
          mkdir -p .ci/observation-evidence
          node apps/cli/dist/main.js usage-audit --run "$E2E_OBSERVATION_RUN_ID" --strict

      - name: Upload observation evidence (E4-R24)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-evidence-${{ matrix.os }}-${{ github.run_id }}
          path: .ci/observation-evidence/
          if-no-files-found: warn

      - name: Benchmark smoke (stub/fake provider — no paid model)
        # One adversarial case through the real harness with the stub provider.
        # The run itself never fails (stub MODEL_ERROR is recorded honestly);
        # this gate fails only if the harness cannot load/run/freeze a case.
        run: pnpm benchmark:smoke

      - name: Upload benchmark smoke report (P12-5)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ matrix.os }}
          path: .ci/bench-smoke/*.md
          if-no-files-found: error

      # E4-R84: the campaign-level evidence chain, validated on BOTH platforms
      # from a fully SYNTHETIC committed fixture. The operator's real R83
      # campaign stays on their own machine (it is git-ignored and is never
      # uploaded); CI proves the VALIDATOR is deterministic and
      # cross-platform, not that a particular paid run happened.
      - name: Campaign evidence chain — synthetic fixture validates (E4-R84)
        shell: pwsh
        run: |
          # E4-R84: GitHub Actions wraps every `shell: pwsh` step as
          #   $ErrorActionPreference = 'stop'  <script>  exit $LASTEXITCODE
          # This step's whole point is to run validations that MUST exit
          # non-zero, so without care the wrapper would inherit the last
          # deliberate failure and fail the job even though every assertion
          # passed (observed: exit 1 on both platforms with all checks OK).
          # Fixes, both required:
          #   1. check $LASTEXITCODE explicitly after each native command, so a
          #      real failure is caught HERE rather than being masked later;
          #   2. end with an explicit `exit 0` — a `throw` above still aborts
          #      first, so real failures are never swallowed.
          $ErrorActionPreference = 'stop'

          # 1. The fixture must match its committed generator byte-for-byte, so
          #    it cannot have been hand-tuned to satisfy the validator.
          pnpm benchmark:campaign:fixture-check
          if ($LASTEXITCODE -ne 0) { throw "fixture check failed (exit $LASTEXITCODE)" }
          # 2. The committed fixture must validate, with the exact numbers the
          #    generator put in it.
          pnpm benchmark:campaign:validate
          if ($LASTEXITCODE -ne 0) { throw "fixture campaign did not validate (exit $LASTEXITCODE)" }
          # 3. The SAME run must be reproducible: validate twice, same digest.
          #    (2>$null: the harness prints an advisory context-budget note on
          #    stderr; --json output on stdout must stay parseable.)
          $first = (node apps/cli/dist/main.js benchmark campaign validate `
            scripts/benchmark/fixtures/r84-campaign/campaign `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --json 2>$null) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "the --json validation failed (exit $LASTEXITCODE)" }
          $second = (node apps/cli/dist/main.js benchmark campaign validate `
            scripts/benchmark/fixtures/r84-campaign/campaign `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --json 2>$null) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "the second --json validation failed (exit $LASTEXITCODE)" }
          # Guard the comparisons below against a vacuous pass: two nulls would
          # compare equal and a missing summary would satisfy nothing.
          if ($null -eq $first -or $null -eq $second) {
            throw "--json produced no parseable object (first=$($null -eq $first) second=$($null -eq $second))"
          }
          if ([string]::IsNullOrEmpty($first.rootDigest)) { throw "--json carried no rootDigest" }
          if ($first.rootDigest -ne $second.rootDigest) {
            throw "campaign root digest is not deterministic: $($first.rootDigest) vs $($second.rootDigest)"
          }
          if ($first.summary.passed -ne 1 -or $first.summary.processRunSuccesses -ne 3) {
            throw "fixture summary drifted: passed=$($first.summary.passed) processRunSuccesses=$($first.summary.processRunSuccesses)"
          }
          Write-Host "E4-R84 fixture digest (deterministic): $($first.rootDigest)"
          # 4. Tamper detection: one changed byte must FAIL the campaign.
          #    The recorded evidence manifest is what makes this DETECTING
          #    rather than merely evident: the recorded per-file hashes are
          #    compared against what is on disk now.
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          Copy-Item -Recurse -Force scripts/benchmark/fixtures/r84-campaign/campaign .ci/r84-tamper
          if (-not (Test-Path .ci/r84-tamper/results/stress/syn-str-1/stress.json)) {
            throw "the tamper copy did not materialise — the rest of this step would be meaningless"
          }
          node apps/cli/dist/main.js benchmark campaign validate .ci/r84-tamper `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --emit-evidence .ci/r84-fixture-evidence.json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not emit the fixture evidence manifest" }
          $target = ".ci/r84-tamper/results/stress/syn-str-1/stress.json"
          $original = Get-Content $target -Raw
          $tampered = $original.Replace('"model_calls": 9', '"model_calls": 10')
          # If the needle ever stops matching, the Replace is a silent no-op and
          # the "tamper detected" assertion below would pass for the wrong
          # reason. Assert the mutation really happened first.
          if ($tampered -eq $original) { throw "the tamper mutation did not apply — needle not found in $target" }
          Set-Content $target -Value $tampered -NoNewline
          node apps/cli/dist/main.js benchmark campaign validate .ci/r84-tamper `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --evidence .ci/r84-fixture-evidence.json
          if ($LASTEXITCODE -eq 0) { throw "a tampered campaign validated — tamper detection is broken" }
          Write-Host "E4-R84 tamper detection OK (tampered campaign rejected, exit $LASTEXITCODE)"
          # 4b. An ADDED file must also fail.
          Set-Content .ci/r84-tamper/results/stress/syn-str-1/injected.log "x"
          node apps/cli/dist/main.js benchmark campaign validate .ci/r84-tamper `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --evidence .ci/r84-fixture-evidence.json
          if ($LASTEXITCODE -eq 0) { throw "an injected evidence file validated — tamper detection is broken" }
          Write-Host "E4-R84 injected-file detection OK (exit $LASTEXITCODE)"
          # 5. A summary-only tree (no raw reports) must FAIL closed.
          New-Item -ItemType Directory -Force -Path .ci/r84-summary-only | Out-Null
          Copy-Item scripts/benchmark/fixtures/r84-campaign/campaign/campaign-summary.json .ci/r84-summary-only/
          node apps/cli/dist/main.js benchmark campaign validate .ci/r84-summary-only `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress
          if ($LASTEXITCODE -eq 0) { throw "a summary-only tree validated — the validator is not fail-closed" }
          Write-Host "E4-R84 summary-only tree rejected OK (exit $LASTEXITCODE)"

          # See the header note: the deliberate failures above are the point of
          # this step, so the step's own exit status must be set explicitly.
          # Every assertion reaching this line passed.
          exit 0

      # E4-R85: the failure-attribution pass must be OFFLINE, DETERMINISTIC and
      # IDENTICAL on Windows and Ubuntu. The digest below is pinned literally:
      # if the two platforms ever disagree, one of them fails here — which is
      # the whole point, since the plan requires the same digest on both.
      # Runs against the same committed synthetic fixture as R84 (0 provider
      # calls, no API key, no network).
      - name: Campaign failure triage — offline, deterministic digest (E4-R85)
        shell: pwsh
        run: |
          # See the R84 step header: this step deliberately runs commands that
          # exit non-zero, so $ErrorActionPreference='stop' plus an explicit
          # `exit 0` is required or the wrapper inherits the last failure.
          $ErrorActionPreference = 'stop'

          $fixture = "scripts/benchmark/fixtures/r84-campaign/campaign"
          $cases = "scripts/benchmark/fixtures/r84-campaign/cases"
          # The digest that the committed fixture MUST produce on every platform.
          # R90: re-pinned deliberately. The taxonomy no longer equates a tool
          # failure with a model-behaviour error and each candidate now separates
          # a reproduced MECHANISM from confirmed HISTORICAL attribution, so the
          # triage schema went 1 -> 2 and the digest legitimately changed. The
          # gate itself is NOT weakened: the digest is still pinned exactly, and
          # the extra R90 assertions below are added, not removed.
          $expected = "8481ee0be8f07e2fa262fd32f8ecab1ed7baa6701e7f6c3c9cb233806a33456c"

          # 1. Triage the fixture twice into separate directories.
          node apps/cli/dist/main.js benchmark campaign triage $fixture `
            --out .ci/r85-triage-1 --cases $cases --suites adversarial,stress 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the first triage run failed (exit $LASTEXITCODE)" }
          node apps/cli/dist/main.js benchmark campaign triage $fixture `
            --out .ci/r85-triage-2 --cases $cases --suites adversarial,stress 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the second triage run failed (exit $LASTEXITCODE)" }

          # 2. Byte-identical across two consecutive runs (no clock/ordering drift).
          $a = Get-Content .ci/r85-triage-1/campaign-triage.json -Raw
          $b = Get-Content .ci/r85-triage-2/campaign-triage.json -Raw
          if ($a -ne $b) { throw "triage JSON is not byte-identical across two runs" }
          $mdA = Get-Content .ci/r85-triage-1/campaign-triage.md -Raw
          $mdB = Get-Content .ci/r85-triage-2/campaign-triage.md -Raw
          if ($mdA -ne $mdB) { throw "triage markdown is not byte-identical across two runs" }

          # 3. The pinned cross-platform digest must match EXACTLY. This is the
          #    assertion that makes Windows and Ubuntu provably agree.
          $parsed = $a | ConvertFrom-Json
          if ([string]::IsNullOrEmpty($parsed.triageDigest)) { throw "triage JSON carried no triageDigest" }
          if ($parsed.triageDigest -ne $expected) {
            throw "triage digest drifted on this platform: got $($parsed.triageDigest), want $expected"
          }
          if ($parsed.verdict -ne "NO_CONFIRMED_HARNESS_DEFECT") {
            throw "the fixture verdict drifted: $($parsed.verdict)"
          }
          Write-Host "E4-R85 triage digest (cross-platform): $($parsed.triageDigest)"

          # 3b. R90: the taxonomy schema is v2, and every candidate MUST separate
          #     the reproduced mechanism from confirmed historical attribution.
          #     A candidate count may never be presented as a confirmed count.
          if ($parsed.schemaVersion -ne 2) { throw "triage schema is not v2 (got $($parsed.schemaVersion))" }
          foreach ($c in @($parsed.candidates)) {
            if ($c.mechanismStatus -notin @('MECHANISM_REPRODUCED','MECHANISM_NOT_REPRODUCED','UNKNOWN')) {
              throw "candidate $($c.id) has an invalid mechanismStatus: $($c.mechanismStatus)"
            }
            if ($c.caseAttributionStatus -notin @('CONFIRMED_AFFECTED','CANDIDATE_ONLY','UNKNOWN')) {
              throw "candidate $($c.id) has an invalid caseAttributionStatus: $($c.caseAttributionStatus)"
            }
            if ($c.confirmedAffectedCases.Count -gt $c.candidateCases.Count) {
              throw "candidate $($c.id) claims more confirmed cases than candidates"
            }
            if ($c.affectedCases -ne $c.candidateCases.Count) {
              throw "candidate $($c.id) affectedCases does not equal its candidateCases count"
            }
            if ($c.confirmedAffectedCases.Count -eq 0 -and $c.caseAttributionStatus -eq 'CONFIRMED_AFFECTED') {
              throw "candidate $($c.id) claims CONFIRMED_AFFECTED with no confirmed case"
            }
          }
          Write-Host "E4-R90 candidate evidence split OK (mechanism vs. confirmed historical attribution)"

          # 3c. R90: no case may be convicted of MODEL_BEHAVIOR on a tool-failure
          #     COUNT alone. Without recorded feedback the class must be
          #     INSUFFICIENT_EVIDENCE carrying the provenance-unknown tag.
          foreach ($case in @($parsed.cases)) {
            if ($case.primary -ne 'MODEL_BEHAVIOR') { continue }
            if ($case.toolFailures -gt 0 -and $case.toolFailureFeedback -ne 'tool_error_reported') {
              throw "case $($case.caseId) was attributed to MODEL_BEHAVIOR without feedback evidence"
            }
          }
          Write-Host "E4-R90 no tool-failure-count-only MODEL_BEHAVIOR attribution OK"

          # 4. No secret, endpoint or absolute path may enter the artifact.
          #    `sk-` is checked as a KEY SHAPE, not a bare substring: the
          #    literal "task-verifier" contains "sk-" and would make the check
          #    both noisy and untrustworthy.
          foreach ($text in @($a, $mdA)) {
            if ($text -match 'sk-[A-Za-z0-9_-]{16,}') { throw "triage artifact leaked an API-key shape" }
            if ($text -match 'Bearer\s+\S{16,}') { throw "triage artifact leaked a bearer token" }
            if ($text -match 'Authorization\s*[:=]') { throw "triage artifact leaked an Authorization header" }
            if ($text -match 'https?://') { throw "triage artifact leaked an endpoint" }
            if ($text -match '[A-Za-z]:[\\/]') { throw "triage artifact leaked an absolute path" }
            if ($text -match '/home/') { throw "triage artifact leaked a POSIX home path" }
            # A timestamp would make the artifact drift with the clock.
            if ($text -match '\b20\d\d-\d\d-\d\dT') { throw "triage artifact carries a timestamp" }
          }
          Write-Host "E4-R85 redaction OK (no key, endpoint, path or timestamp)"

          # 5. A campaign that does not validate must NOT report success.
          New-Item -ItemType Directory -Force -Path .ci/r85-missing | Out-Null
          node apps/cli/dist/main.js benchmark campaign triage .ci/r85-missing `
            --out .ci/r85-invalid --cases $cases --suites adversarial,stress 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "triage reported success on an invalid campaign" }
          $invalid = (Get-Content .ci/r85-invalid/campaign-triage.json -Raw | ConvertFrom-Json)
          if ($invalid.campaignValid -ne $false) { throw "invalid campaign was marked valid" }
          Write-Host "E4-R85 invalid-campaign handling OK (exit non-zero, still inspectable)"

          exit 0

      # E4-R86 (H2): the progress-blind identical-call gate is fixed, and this
      # step proves the FIX PATH is reachable and observable on BOTH platforms,
      # not merely that a final pass rate moved. It asserts the structured
      # evidence the fix emits (`stall.progress_detected`) and the metric that
      # counts it, using the offline ScriptedModelProvider (0 provider calls,
      # no API key, no network).
      - name: Stall-gate fix — structured evidence is observable (E4-R86)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'

          # 1. The offline H2 suites: the flipped R85 reproducer, the
          #    counterexample + security regression, and the offline replay over
          #    the committed R85 taxonomy record. All deterministic, no network.
          pnpm exec vitest run `
            packages/core/src/runtime/r85-h2-progress-blind-gate.test.ts `
            packages/core/src/runtime/r86-h2-offline-replay.test.ts `
            packages/core/src/state/agent-state.test.ts 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "the R86 H2 suites failed (exit $LASTEXITCODE)" }

          # 2. The threshold must be BOUND INTO the effective config and the
          #    execution-plan digest, not left implicit in runtime defaults
          #    (plan R86.2.5). A change to it must move the digest.
          pnpm exec vitest run apps/cli/src/benchmark-command.test.ts `
            -t "stall-threshold change changes the plan digest" 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "the stall-threshold digest binding test failed (exit $LASTEXITCODE)" }

          # 3. The event type is declared, has a typed payload, and is
          #    OBSERVABILITY-ONLY (never a semantic journal record: the fix must
          #    not alter durable truth or replay semantics).
          $eventSrc = Get-Content packages/contracts/src/event.ts -Raw
          if ($eventSrc -notmatch '"stall\.progress_detected"') { throw "the stall.progress_detected event type is not declared" }
          $semantic = [regex]::Match($eventSrc, 'SEMANTIC_JOURNAL_EVENTS[^=]*=\s*new Set<EventType>\(\[(.*?)\]\)', 'Singleline').Groups[1].Value
          if ($semantic -match 'stall\.progress_detected') { throw "stall.progress_detected was added to SEMANTIC_JOURNAL_EVENTS — it must stay observability-only" }
          $payloadSrc = Get-Content packages/contracts/src/event-payloads.ts -Raw
          if ($payloadSrc -notmatch 'StallProgressDetectedPayload') { throw "the stall.progress_detected payload type is not declared" }

          # 4. The metric that makes the fix path countable exists.
          $metricsSrc = Get-Content packages/observability/src/metrics.ts -Raw
          if ($metricsSrc -notmatch 'stall_progress_cancellations') { throw "the stall_progress_cancellations metric is not derived" }

          # 5. The threshold is recorded in the effective config + digest inputs.
          $manifestSrc = Get-Content packages/evaluation/src/manifest.ts -Raw
          if ($manifestSrc -notmatch 'stallPolicy') { throw "the stall policy is not part of the effective config" }
          $benchSrc = Get-Content apps/cli/src/benchmark-command.ts -Raw
          if ($benchSrc -notmatch 'BENCHMARK_STALL_POLICY') { throw "the benchmark path does not pin the stall policy" }

          Write-Host "E4-R86 H2 fix path observable on $($env:RUNNER_OS): suites green, event observability-only, metric derived, threshold digest-bound"
          exit 0

      # E4-R87 Phase A: zero-call replay A/B over the frozen, digest-bound case
      # selection (plan §R87 — "优先先跑零调用 replay A/B"). Proves the R86
      # candidate hits the TARGET path: the baseline arm reproduces the recorded
      # H2 fingerprint class on all 3 TARGET cases, the candidate arm completes
      # them with progress evidence, counterexamples stay outcome-invariant, and
      # the paid gate outputs NOT_RUN: PAID_AUTHORIZATION_REQUIRED. 0 provider
      # calls (ScriptedModelProvider only), no key, no network. The committed
      # manifest (docs/evidence/e4-r87-phase-a-manifest.json) is re-verified
      # against a fresh replay (validator can recompute every summary).
      - name: Zero-call replay A/B over frozen cases, digest-bound (E4-R87 Phase A)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          pnpm exec vitest run `
            packages/core/src/runtime/r87-zero-call-replay-ab.test.ts 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "the R87 Phase A replay A/B suite failed (exit $LASTEXITCODE)" }
          Write-Host "E4-R87 Phase A on $($env:RUNNER_OS): baseline reproduces the H2 class, candidate completes targets, counterexamples invariant, paid path NOT_RUN, manifest re-verified"
          exit 0

      # E4-R88 (F1/F2): the A/B verdict and resume path must REFUSE incomplete or
      # foreign evidence. The suite proves: a baseline-only / zero-candidate
      # result set can never be MECHANISM_VALIDATED; the expected matrix comes
      # from the FROZEN selection; duplicate/unknown/mis-suite/mis-role records,
      # non-finite or negative metrics and unmet expectations are REJECTED; the
      # resume state binds schema + selection digest + implementation SHA + arm
      # semantics + limits + fixture digest; foreign/stale/truncated state fails
      # closed BEFORE any arm runs; and the offline validator recomputes every
      # hash and the verdict without touching a model or the network.
      - name: Incomplete/foreign evidence is refused by the A/B gate (E4-R88)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          pnpm exec vitest run `
            packages/core/src/runtime/r88-replay-evidence-gate.test.ts `
            packages/core/src/runtime/r87-zero-call-replay-ab.test.ts 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "the R88 evidence-gate suites failed (exit $LASTEXITCODE)" }
          # The emitted v2 manifest must validate offline, and the historical v1
          # manifest must still be present, readable and NOT blessed as verified.
          $legacy = Get-Content docs/evidence/e4-r87-phase-a-manifest.json -Raw | ConvertFrom-Json
          if ($legacy.schemaVersion -ne 'e4-r87-phase-a-manifest-v1') { throw "the legacy R87 manifest was rewritten or removed" }
          # R90: the emitted manifest is now v3. The superseded v2 artifact stays
          # on disk as a versioned ERRATUM (never deleted, never re-blessed),
          # because its `sourceSha` implied a historical checkout that never ran.
          $v2 = Get-Content docs/evidence/e4-r88-phase-a-manifest.json -Raw | ConvertFrom-Json
          if ($v2.schemaVersion -ne 'e4-r88-phase-a-manifest-v2') { throw "the superseded R88 manifest was rewritten or removed" }
          if ($v2.summary.completeness -ne 'COMPLETE') { throw "the R88 manifest is not COMPLETE" }
          if ($v2.summary.expectedRecords -ne $v2.summary.observedRecords) { throw "the R88 manifest matrix is incomplete" }
          if ($v2.providerCalls -ne 0) { throw "the R88 manifest claims provider calls" }
          if ($v2.gate.status -ne 'NOT_RUN') { throw "the R88 paid gate did not stop at NOT_RUN" }
          Write-Host "E4-R88 on $($env:RUNNER_OS): incomplete/foreign evidence refused, resume identity bound, validator offline, legacy v1 + superseded v2 preserved unverified"
          exit 0

      # E4-R90: evidence-grade correction (F6). The manifest must record what
      # ACTUALLY executed, label the baseline as an emulated semantic switch
      # rather than a checked-out historical build, and declare how many
      # independent mechanism scenarios the synthetic labels represent. Offline,
      # 0 provider calls.
      - name: Evidence-grade correction — executed identity, emulated baseline, raw-byte audit (E4-R90)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          pnpm exec vitest run `
            packages/core/src/runtime/r87-zero-call-replay-ab.test.ts `
            packages/core/src/runtime/r88-replay-evidence-gate.test.ts `
            packages/evaluation/src/campaign-triage.test.ts `
            packages/evaluation/src/campaign-validate.test.ts 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "the E4-R90 suites failed (exit $LASTEXITCODE)" }

          # 1. The v3 manifest separates the EXECUTED sha from the historical
          #    reference, and declares the emulated baseline.
          $v3 = Get-Content docs/evidence/e4-r90-phase-a-manifest.json -Raw | ConvertFrom-Json
          if ($v3.schemaVersion -ne 'e4-r90-phase-a-manifest-v3') { throw "the R90 manifest schema is not v3" }
          if ([string]::IsNullOrEmpty($v3.identity.executedSourceSha)) { throw "the R90 manifest records no executedSourceSha" }
          if ($v3.identity.executedSourceSha -ne $v3.identity.implementationSha) { throw "executedSourceSha disagrees with the executed implementation" }
          if ($v3.identity.executedSourceSha -eq $v3.identity.historicalReferenceSha) { throw "the R90 manifest conflates the executed and historical revisions" }
          if ($v3.identity.baselineMode -ne 'emulated_semantics') { throw "the R90 baseline is not declared emulated" }
          if ($v3.identity.experimentKind -ne 'synthetic_mechanism') { throw "the R90 experiment is not declared synthetic" }
          if ($v3.scope.historicalReferenceCheckedOut -ne $false) { throw "the R90 manifest claims the historical revision was checked out" }
          if ($v3.identity.syntheticScenarios.independentScenarioCount -ne 1) { throw "the R90 manifest overstates the independent scenario count" }
          if ($v3.identity.syntheticScenarios.targetLabels -ne 3) { throw "the R90 manifest lost the 3-target label mapping" }
          if ($v3.providerCalls -ne 0) { throw "the R90 manifest claims provider calls" }
          if ($v3.gate.status -ne 'NOT_RUN') { throw "the R90 paid gate did not stop at NOT_RUN" }
          Write-Host "E4-R90 executed identity / emulated baseline / synthetic mapping OK"

          # 2. A versioned erratum, not a deletion: v1 AND the superseded v2 must
          #    both still be present and unmodified in their declared schemas.
          $v1 = Get-Content docs/evidence/e4-r87-phase-a-manifest.json -Raw | ConvertFrom-Json
          if ($v1.schemaVersion -ne 'e4-r87-phase-a-manifest-v1') { throw "the historical v1 manifest was rewritten" }
          $v2 = Get-Content docs/evidence/e4-r88-phase-a-manifest.json -Raw | ConvertFrom-Json
          if ($v2.schemaVersion -ne 'e4-r88-phase-a-manifest-v2') { throw "the superseded v2 manifest was rewritten" }
          Write-Host "E4-R90 history preserved (v1 legacy + v2 superseded erratum both intact)"

          # 3. The normalized digest and the raw-byte digest are SEPARATE facts.
          #    A CRLF-only change must move rawRootDigest while leaving the
          #    normalized rootDigest (and therefore the pinned fixture digest)
          #    untouched. Asserted by the validator suite above; re-stated here so
          #    the CI log names the distinction explicitly.
          Write-Host "E4-R90 normalized content integrity and raw-byte audit are declared separately"
          exit 0

      # E4-R91 (H1): Windows verifier determinism. The point of this step is to
      # REALLY START the fixtures on windows-latest — not to assert mock spawn
      # arguments. Before R91, `spawn(..., {shell:false})` could not execute a
      # `.cmd`/`.bat` shim at all (EINVAL for a full path, ENOENT for a bare
      # name) nor a `.ps1` (EFTYPE), so every `npx`/`bash` command verifier was
      # unspawnable on Windows while the same case passed elsewhere.
      - name: Windows script-shim determinism — real launches, no injection (E4-R91)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'

          # The suite contains Windows-only REAL execution tests (skipped on
          # Ubuntu, which cannot run .cmd/.ps1) plus a platform-parameterised
          # decision table that runs everywhere.
          pnpm exec vitest run packages/tools/src/process/executor.test.ts packages/tools/src/verification/task-verifier.test.ts 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "the E4-R91 suites failed (exit $LASTEXITCODE)" }

          # The R79 boundary must still hold: no argument may start a second
          # command, and the argv path must never hand a joined string to a shell.
          $executorSrc = Get-Content packages/tools/src/process/executor.ts -Raw
          if ($executorSrc -notmatch 'shell: false') { throw "the argv path no longer spawns with shell:false" }
          if ($executorSrc -match 'shell: true') { throw "the argv path must never enable shell:true" }
          Write-Host "E4-R91 argv path still uses shell:false and never shell:true"

          if ($IsWindows) {
            # Prove it end-to-end with the REAL executor via a committed probe
            # script (kept out of the workflow so it is reviewable and runnable
            # locally). It starts real .cmd/.ps1 fixtures and asserts that a
            # metacharacter argument is refused without creating a sentinel.
            node scripts/e4/r91-shim-probe.mjs
            if ($LASTEXITCODE -ne 0) { throw "the E4-R91 real Windows launch probe failed (exit $LASTEXITCODE)" }
            Write-Host "E4-R91 real Windows launches verified (bare-name .cmd ran; .ps1 args literal; injection refused)"
          } else {
            Write-Host "E4-R91: not Windows — the platform-parameterised decision table ran; the real shim launches are Windows-only and were skipped"
          }
          exit 0

      # E4-R84: the runner's own control flow (stage -> dry-run -> digest ->
      # persist -> resume-skip -> validate), offline, 0 provider calls.
      # Windows-only: it drives the PowerShell runner that produced the real
      # campaign, and its -DryRunOnly path is the free half of that runner.
      - name: Campaign runner self-check — offline, 0 provider calls (E4-R84)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/benchmark/selfcheck-campaign-runner.ps1

      # E4-R94 (findings B/C): the campaign runner's interruption-recovery
      # contract. Resume must RE-OBSERVE the current case identity and the report
      # content hash (never compare the stored digest with itself); the durable
      # `in_flight` intent must be written BEFORE any billable child starts; a
      # corrupt/conflicting manifest must be a stable DAMAGED state; and a
      # dispatched attempt with no terminal record must be OUTCOME_UNKNOWN, never
      # silently re-billed. Drives the FAKE CLI, so 0 provider calls, 0 network.
      - name: Campaign runner interruption-recovery contract (E4-R94)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/benchmark/selfcheck-r94-runner.ps1
          if ($LASTEXITCODE -ne 0) { throw "E4-R94 self-check failed ($LASTEXITCODE)" }

      # E4-R89 (F3/F4/F5): the campaign runner's authorization gate must READ its
      # inputs and never create them; completion must be identity-bound rather
      # than "the report file exists"; and the --suites value must be the
      # comma-joined suite list, never a hashtable. The whole suite drives a FAKE
      # CLI, so it makes zero provider calls and needs no key.
      #
      # Runs on BOTH OSes: the offline contract must hold on Windows and on
      # Ubuntu/pwsh alike (pwsh is preinstalled on the GitHub-hosted runners).
      - name: Campaign runner authorization/identity/argv contract (E4-R89)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/benchmark/selfcheck-r89-runner.ps1
          if ($LASTEXITCODE -ne 0) { throw "E4-R89 self-check failed ($LASTEXITCODE)" }
          # The runner must never grant itself the paid authorization. Scan the
          # runner's CODE with comments removed (the file documents the rule in
          # its comment-based help, so a raw text scan would match its own
          # documentation). A legitimate restore assigns a saved VARIABLE; only a
          # literal "1" is the historical defect.
          $raw = Get-Content scripts/benchmark/run-campaign.ps1 -Raw
          $noBlockComments = [regex]::Replace($raw, '(?s)<#.*?#>', '')
          $code = ($noBlockComments -split "`n" | ForEach-Object { ($_ -replace '#.*$', '') }) -join "`n"
          $bad = [regex]::Matches($code, '\$env:RUN_PAID_BENCHMARKS\s*=\s*["'']1["'']')
          if ($bad.Count -gt 0) {
            throw "run-campaign.ps1 SETS RUN_PAID_BENCHMARKS itself ($($bad.Count) site(s)) — authorization must be read, never created"
          }
          # A hashtable must never reach --suites.
          if (Select-String -Path scripts/benchmark/run-campaign.ps1 -Pattern '--suites",\s*\$suiteList' -Quiet) {
            throw "run-campaign.ps1 passes a hashtable list to --suites"
          }
          # Negative control: the guard must still detect the original defect.
          # E4-R92: the sample is assembled from fragments so the contiguous
          # literal never appears in this file. The R82 cold-start job greps
          # THIS workflow for a paid-authorization literal, so spelling the
          # control out in full made that guard fail on its own control string —
          # a red CI run with every local gate green. Assembling it keeps the
          # control honest (it still exercises the detector) without the file
          # ever containing the pattern the detector looks for.
          $controlSample = '$env:RUN_PAID_BENCHMARKS' + ' = ' + '"1"'
          $control = [regex]::Matches($controlSample, '\$env:RUN_PAID_BENCHMARKS\s*=\s*["'']1["'']')
          if ($control.Count -eq 0) {
            throw "the RUN_PAID_BENCHMARKS guard is broken (it no longer detects the original defect)"
          }
          Write-Host "E4-R89 on $($env:RUNNER_OS): authorization read-not-created, completion identity-bound, argv contract held, 0 provider calls"
          exit 0

      - name: Upload campaign evidence fixture report (E4-R84)
        uses: actions/upload-artifact@v4
        with:
          name: campaign-evidence-${{ matrix.os }}
          path: docs/evidence/e4-r83-campaign-manifest.json
          if-no-files-found: error

      - name: Upload test report (P12-5)
        # P37-13: upload even on failure so CI failures are debuggable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: .ci/test-report.log
          if-no-files-found: error

      # E4-R40 (K01) / E4-R46: when a test fails, upload the attribution bundles
      # the e4-09 diagnostic recorder wrote BEFORE its temp roots were cleaned
      # (identity/HEAD/cleanliness, real V3+paired+decision bytes with reduced
      # summaries, the real gate child exit/stderr, the benchmark's own CLI
      # exit+output). A green run writes nothing and uploads nothing, so this
      # step only ever fires on a genuinely failing run.
      # E4-R46: artifact name carries `-attempt-${{ github.run_attempt }}` so a
      # retry of a failing run in GitHub Actions cannot clash or overwrite the
      # previous attempt's diagnostic artifact.
      - name: Upload e4-09 diagnostic bundles (E4-R40, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e4-09-diagnostics-${{ matrix.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .ci/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # E4-R60 (G60): the R55 parent verifier preserves the child's bounded
      # stdout/stderr, its raw report, its diagnostic bundle tree and a
      # machine-readable run.json with every judgement reason BEFORE it releases
      # the run's temp roots. Uploading it here means a failed parent
      # verification is debuggable from the artifact alone — it no longer
      # depends on the e4-09 hook above, which only covers the e4-09 suite's own
      # failures. A green run preserves nothing and uploads nothing.
      - name: Upload R55 parent-verifier diagnostics (E4-R60, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e4-r55-parent-diagnostics-${{ matrix.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .ci/r55-parent-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # P38.2-4 (INV-P38.2-004): every attempted gate emits truthful evidence
      # from its REAL exit code. E4-R09 (F19): the evidence is produced by the
      # SAME production GateEvidenceV2 generator the verifier/collector consume
      # (`release gate` -> runGateV2) — never hand-written schemaVersion=1 JSON.
      # Each `release gate` runs the canonical GATE_COMMANDS command, binds git
      # state before/after + real exit code + digests, and writes DURABLE V2
      # evidence before returning; a red gate propagates its own exit code.
      # P38.2-10: evidence is namespaced per OS (linux/ windows).
      - name: Generate gate execution evidence (P38.2-4/10, E4-R09 unified V2)
        shell: bash
        run: |
          OS=$(case "${{ matrix.os }}" in *windows*) echo windows;; *) echo linux;; esac)
          EVID=".ci/evidence/gates/$OS"
          mkdir -p "$EVID"
          rc=0
          for gate in typecheck test build benchmark_smoke capability_audit docs protocol security race chaos; do
            ERR="$EVID/$gate.stderr"
            # E4-R09: duplicate the gate output into a file; every red gate also
            # emits a ::error:: workflow annotation naming the gate + its last
            # output lines, so CI annotations name the failing gate without
            # needing full log access.
            if ! node apps/cli/dist/main.js release gate "$gate" --evidence-dir "$EVID" >"$ERR" 2>&1; then
              rc=1
              # Annotate the FAILING lines (not just the tail): docs/audit gates
              # print their failing check near the top/middle of the output.
              grep -niE "fail|error|✗|inconsistent|missing|expected" "$ERR" | head -n 30 | while IFS= read -r l; do echo "::error file=${GITHUB_WORKFLOW:-ci.yml},title=release gate $gate failed::$l"; done
            fi
          done
          # Every attempted gate's evidence is durable (the generator wrote it
          # before returning); fail with the first red gate's rc semantics.
          for f in "$EVID"/*.json; do
            [ -s "$f" ] || { echo "ERROR: empty evidence $f"; rc=1; }
          done
          exit $rc

      # P38.2-11: the AUTHORITATIVE capability matrix is generated AFTER the
      # gate evidence exists — `audit` synthesizes capability test_run evidence
      # from the passing `test` gate + the reviewed manifest (P38.2-5/11), so
      # the artifact carries real integrationTested status at the immutable
      # github.sha, not an evidence-less snapshot.
      - name: Generate capability matrix (P12-5, P38.2-11 real wiring evidence)
        run: node apps/cli/dist/main.js audit --out .ci/capability

      - name: Upload capability matrix (P12-5, P38.2-11)
        uses: actions/upload-artifact@v4
        with:
          # P38.2-11 (INV-P38.2-011): the CI artifact is the AUTHORITATIVE
          # capability record, bound to the immutable github.sha. The tracked
          # repository snapshot is informational only (marked NOT RELEASE
          # EVIDENCE) and must never be treated as release attestation.
          name: capability-matrix-${{ github.sha }}-${{ matrix.os }}
          path: |
            .ci/capability/CAPABILITY_MATRIX.md
            .ci/capability/CAPABILITY_MATRIX.json
          if-no-files-found: error

      - name: Upload gate evidence (P38.2-10)
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ matrix.os }}
          path: .ci/evidence/gates/
          if-no-files-found: error

  # P20-4: coverage is a REAL CI gate. A single ubuntu job is enough (Windows
  # need not repeat coverage). `pnpm test:coverage` fails (exit 1) when any
  # per-package threshold in vitest.config.ts is missed — a threshold dip
  # turns this job red; there is no separate success-only reporting step.
  coverage:
    name: coverage gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Coverage gate (thresholds fail the job)
        # v8 provider + json-summary reporter emit coverage/coverage-summary.json.
        # A missed per-package threshold exits non-zero — no threshold is ever
        # lowered silently to make this pass (see vitest.config.ts).
        # E4-R57 (G57): the entry itself runs `tsc -b` first. The gate-isolation
        # suite treats apps/cli/dist + node_modules/.cache/tsbuildinfo as REQUIRED
        # protected resources, so a clean checkout (install, no build) produced an
        # invalid "before" snapshot (ENOENT on both). The build lives in the
        # `test:coverage` script — not in a duplicated step here — so this job,
        # the `release gate coverage` CLI (release-verify.ts maps the gate to the
        # same command) and the documented local entry cannot drift apart.
        run: pnpm test:coverage

      - name: Upload coverage summary (P20-4)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

      # P38-12 + E4-R09 (F19): coverage gate evidence via the SAME V2 generator
      # (runs the canonical `pnpm test:coverage`, binds real exit + git state +
      # digests, writes to gates/coverage/ matching the attestation layout).
      - name: Generate coverage gate evidence (P38-12, E4-R09 V2)
        run: |
          node apps/cli/dist/main.js release gate coverage --evidence-dir .ci/evidence/gates/coverage

      - name: Upload coverage gate evidence (P38-12)
        uses: actions/upload-artifact@v4
        with:
          # E4-R21 (F01): upload from the gates/ root so the artifact keeps the
          # `coverage/` namespace — the attestation job then restores the exact
          # gates/<platform>/ bundle layout the evidence refs are relative to
          # (logRef paths are relative to the evidence file's directory).
          name: gate-evidence-coverage
          path: .ci/evidence/gates/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # E4-R101-A (plan §T6 怎么做 1/2/3/5, 怎么验收 1/2): the R97/R98 offline closed
  # loop on a CLEAN runner, on WINDOWS and on UBUNTU.
  #
  # PROVES: with NO developer-private directory (`D:/r97-arm-*` is gone), two REAL
  # arm checkouts are built from THIS repository at their historical SHAs; the
  # frozen selection is planned by each arm's own built CLI; the OFFICIAL campaign
  # entry (`r97-campaign-driver.mjs --arm-worker`) runs the real worker→benchmark
  # execution inside EACH arm's OWN build; the shipped validator re-derives every
  # verdict; and the plan's nine-row acceptance matrix is asserted against vitest's
  # STRUCTURED report, where a `skipped` test FAILS its row.
  #
  # DOES NOT PROVE: the paid two-version experiment. This is OFFLINE with 0
  # provider calls, no key and no network; it shows the loop is RUNNABLE, never
  # that a real run happened or that any pass rate improved. "CI all-green" must
  # NEVER be reported as "the real two-version experiment ran" (plan §R101:
  # 实验结果可运行 ≠ 真实实验已运行).
  #
  # WHY THE WHOLE JOB IS NOW ONE NODE COMMAND (plan 怎么做 1)
  # -------------------------------------------------------
  # This job used to be ~200 lines of bash: `git worktree`, `${!var}` indirection,
  # `set -euo pipefail`, `tr`, `grep -cF`. MEASURED: none of that runs on a Windows
  # runner, so the Windows half of the plan's matrix was unreachable, and an
  # operator on Windows could not reproduce the job without translating it by hand.
  # `scripts/e4/r97-closed-loop.mjs` performs the same sequence with Node's own
  # spawn/read/resolve, which behave identically on both platforms. The arm
  # directories reach the test child through its ENVIRONMENT rather than through
  # the shell's `$GITHUB_ENV` file, whose writer differs per shell.
  #
  # COST: each arm gets a real `pnpm install --frozen-lockfile` + `pnpm build`, on
  # BOTH platforms. MEASURED: `dist/` is git-ignored and absent at BOTH historical
  # SHAs, so no cheaper step can produce `<arm>/apps/cli/dist/main.js` and
  # fabricating it is forbidden. Verified locally for this exact recipe:
  # install+build leaves the arm's `git status --porcelain` EMPTY (node_modules and
  # dist are ignored) — which is what the D6 `clean: true` assertion needs.
  # ---------------------------------------------------------------------------
  r97-r98-closed-loop:
    name: r97-r98 closed loop (${{ matrix.os }})
    strategy:
      # A failure on one platform must not hide the other: the plan requires BOTH
      # legs' evidence, and `fail-fast` would cancel the second before it reported.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # No secrets are configured and none are read. The job-level paid switch is
      # empty, and the ONLY process that sets it is the arm worker's own child —
      # where it is paired with DELETING OPENAI_API_KEY, so the child's provider
      # resolution returns the offline stub (`resolveModelProvider` falls back to
      # the stub when the key is absent). The guard that makes a billed call
      # impossible is the missing KEY, not this variable.
      #
      # The empty string is also what keeps `workflow-paid-authorization.test.ts`
      # green: that scan requires ZERO contiguous paid-switch assignments of the
      # value one anywhere in this file, so this comment must not spell the literal
      # out either — a matrix job must not reintroduce one, not even in prose.
      OPENAI_API_KEY: ""
      RUN_PAID_BENCHMARKS: ""
      # The historical arm revisions, quoted so YAML cannot coerce them.
      R97_ARM_BASELINE_SHA: "e9776ba66190ea63b1bacb685c91aa900b6935e7"
      R97_ARM_CANDIDATE_SHA: "a20373743b56de6a3a110fecdd254737ece71afa"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The arm SHAs may be older than the default shallow clone depth.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the tested revision
        # The R97/R98 suites import the BUILT evaluation package
        # (packages/evaluation/dist/index.js) and drive scripts/e4/… through the
        # built CLI, so the tested revision must be built before anything runs.
        run: pnpm build

      # -----------------------------------------------------------------------
      # THE WHOLE CLOSED LOOP, ONE PLATFORM-NEUTRAL COMMAND (plan 怎么做 1/2/3).
      #
      # `--all` runs, in order: setup (the committed `r97-observe-arms.mjs` creates
      # and builds BOTH arms — a build failure or a missing arm is a SETUP FAILURE,
      # never a skip), acceptance (the OFFICIAL arm-worker entry over the frozen
      # selection, in each arm's own build, then the shipped validator), suite (the
      # R97/R98 files with the real arm dirs in the child env), matrix (the
      # nine-row acceptance matrix from the STRUCTURED vitest JSON), and identity.
      #
      # The `run:` shell differs per platform (pwsh on Windows, bash on Linux), but
      # the command is the same Node invocation, which is the point.
      # -----------------------------------------------------------------------
      - name: Run the offline closed loop (setup -> acceptance -> suite -> matrix -> identity)
        run: node scripts/e4/r97-closed-loop.mjs --all --out .ci/r97-r98 --arms-root "${{ runner.temp }}/r97-arms"

      # -----------------------------------------------------------------------
      # N3 DIAGNOSTICS — publish the closed-loop phase failure and the failing
      # test names into the PUBLIC job summary / annotations, so a cross-platform
      # regression can be read without an authenticated log download.
      #
      # NOTE THE ABSENT `shell:` KEY, which is deliberate and test-pinned: this
      # job must not name the bash shell on ANY step (the Windows leg has no
      # bash), and `r97-closed-loop.test.ts` fails the suite if it does. An
      # earlier revision of this diagnostic named that shell and was caught by
      # exactly that test (measured locally: `1 failed | 23 passed` in
      # `r97-closed-loop.test.ts`). That test is a RAW substring check over this
      # whole job body, so this comment must not spell the pinned literal out
      # either — not even in prose. The step also no longer needs the `tee` pipe
      # the earlier revision used: the runner already writes its own
      # `r97-r98.json` (structured vitest report) and `r97-r98-suite.log`.
      # -----------------------------------------------------------------------
      - name: Publish the closed-loop phase + failing tests to the public summary
        if: failure()
        continue-on-error: true
        run: node scripts/e4/r97-ci-diagnostics.mjs --label closed-loop --out .ci/r97-r98

      # -----------------------------------------------------------------------
      # THE ANTI-CHEAT MUTATIONS (plan §T6 怎么做 7, extended by §A7 怎么做 3).
      #
      #   "mutation/反例直接改变行为：让两臂都用一个构建、跳过 verifier、固定
      #    request=r97、绕过预算、resume 丢历史失败，对应测试必须失败."   (T6)
      #
      #   "mutation gate 保留现有有效覆盖，并补能破坏本轮关键不变量的最小变异，例如跳过
      #    generator finally 结算、允许丢失根目录重新领取、把正式时钟改回快照、恢复
      #    verdict 覆盖、断开当前 unit 的取消."                          (A7)
      #
      # TWELVE mutations now: T6's five, plus one per counterexample A1–A6 closed, plus
      # A1's SECOND — the worker-level settlement-failure branch. That branch was the
      # one residual gap A7 left open ("A1 的 worker 级 settlement-failure 分支未被测试
      # 覆盖", §9.9/§9.10): the channel layer proved the settlement fails, but nothing
      # proved the WORKER refuses to refund and refuses to report a success when it
      # does. Each mutation is APPLIED to the real production source, the test bound to
      # it is run, and that test MUST go RED. Without this, a suite that passes while
      # every mutation goes undetected looks identical to a suite that would catch a
      # real regression.
      #
      # A CAUGHT mutation requires a FAILED TEST, not merely a non-zero exit: the gate
      # refuses a build failure, a collection error and an unrelated timeout, so a
      # broken mutation cannot be reported as a caught one (plan §A7 怎么做 4).
      #
      # This step is deliberately AFTER the closed loop and must not run
      # concurrently with it: it mutates files on disk, so a mutation in flight
      # would make an unrelated test fail. It restores every file in a `finally`,
      # re-hashes it, and compares the whole tracked tree before and after, so a
      # failure here cannot leave the tree mutated.
      #
      # `continue-on-error` is NOT set: a mutation that escapes is a real finding
      # about the suite and must fail the job.
      # -----------------------------------------------------------------------
      - name: Prove the suite CATCHES the twelve anti-cheat mutations (T6's five + A7/A1's seven)
        run: node scripts/e4/r97-mutation-check.mjs --out .ci/r97-r98/mutation-report.json

      # -----------------------------------------------------------------------
      # NO BASH IN THIS JOB (plan 怎么做 1: "不要求 bash、WSL 或 Docker").
      #
      # The previous job was ~200 lines of bash, including the name-based
      # `grep … ✓` assertions that pinned the measured regressions. Those pins are
      # NOT dropped: `r97-acceptance-matrix.mjs` carries them in
      # `PINNED_REGRESSIONS` and refuses a report in which a pinned test is ABSENT
      # or `skipped`. Reading them from vitest's JSON report is strictly stronger
      # than grepping a checkmark out of the verbose text, and it needs no shell.
      #
      # The verbose log is still produced and uploaded as AUXILIARY evidence, which
      # is what plan 怎么做 5 permits ("现有 verbose grep 可以保留为辅助").
      # -----------------------------------------------------------------------

      - name: Upload the closed-loop evidence (E4-R101)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-platform names so BOTH legs' evidence survives; the plan requires
          # each platform's own run, and one artifact name would have them overwrite.
          name: r97-r98-closed-loop-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/r97-r98/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # E4-R82 (F82-1): offline Linux cold-start.
  #
  # The frozen-baseline handoff was only ever validated on the author's Windows
  # machine; the repo had no job that walks the README's cold-start path on
  # Linux, so the POSIX half of the command verifier was unproven. The author has
  # no Linux, WSL or Docker, so this evidence is produced HERE, on GitHub's
  # ubuntu-latest, and is labelled as such — never passed off as the author's
  # machine.
  #
  # Hard constraints, per the plan:
  #   - no secrets are configured and none are read;
  #   - RUN_PAID_BENCHMARKS is never set, so a paid run is structurally
  #     impossible;
  #   - every check asserts providerCalls = 0 and a stub/fake provider, so no
  #     real model is ever contacted;
  #   - the checkout is a REAL cold start in a path containing a space, and it
  #     reuses nothing from the verify job's node_modules or dist.
  # ---------------------------------------------------------------------------
  cold-start-ubuntu:
    name: offline cold-start (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Belt and braces: even if a key leaked into the runner environment, the
      # paid switch stays off for this job.
      RUN_PAID_BENCHMARKS: ""
    steps:
      - name: Check out the repository (into a path containing a space)
        uses: actions/checkout@v4
        with:
          path: "cold start checkout"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22, the LTS line CI standardises on (not the author's local 24).
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "cold start checkout/pnpm-lock.yaml"

      - name: Assert the tested HEAD is the workflow SHA
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checked-out HEAD: $HEAD_SHA"
          echo "github.sha      : ${{ github.sha }}"
          test "$HEAD_SHA" = "${{ github.sha }}"

      - name: Assert this is a genuine cold start (no node_modules, no dist)
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          test ! -d node_modules || { echo "node_modules already present — not a cold start"; exit 1; }
          test ! -d apps/cli/dist || { echo "apps/cli/dist already present — not a cold start"; exit 1; }
          echo "cold start confirmed: no node_modules, no apps/cli/dist"

      - name: README step 1 — install (frozen lockfile)
        working-directory: "cold start checkout"
        run: pnpm install --frozen-lockfile

      - name: README step 2 — build
        working-directory: "cold start checkout"
        run: pnpm build

      - name: Verify the workflow itself cannot authorize a paid run
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          if grep -nE 'RUN_PAID_BENCHMARKS\s*[:=]\s*["'"'"']?1' .github/workflows/ci.yml; then
            echo "workflow file contains a paid authorization — refusing"; exit 1
          fi
          echo "no paid authorization in the workflow"

      - name: README step 3 — doctor
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          mkdir -p .ci/cold-start
          node apps/cli/dist/main.js doctor | tee .ci/cold-start/doctor.txt
          # Machine-check, not just exit 0: no doctor ERRORS may be reported.
          if grep -qiE '^\s*(error|ERROR)\b' .ci/cold-start/doctor.txt; then
            echo "doctor reported errors"; exit 1
          fi

      - name: README step 4 — single adversarial case with the stub provider
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          mkdir -p ".ci/cold start evidence"
          node apps/cli/dist/main.js benchmark \
            --suite adversarial --limit 1 --allow-stub \
            --out ".ci/cold start evidence" | tee .ci/cold-start/stub.txt

      - name: README step 5 — frozen baseline plan (dry-run, no key, 0 provider calls)
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          mkdir -p ".ci/cold start evidence"
          node apps/cli/dist/main.js benchmark \
            --suite regression \
            --cases benchmarks/baseline-e4-r74 \
            --provider openai \
            --model cold-start-model \
            --endpoint https://api.invalid.example/v1 \
            --limit 0 \
            --max-logical-runs 8 --max-model-calls 80 \
            --max-estimated-tokens 320000 --max-estimated-cost-usd 0.04 \
            --dry-run \
            --out ".ci/cold start evidence" > .ci/cold-start/plan.json
          cat .ci/cold-start/plan.json

      - name: Machine-check the artifacts (not just exit codes)
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const fail = (m) => { console.error("COLD-START CHECK FAILED: " + m); process.exit(1); };

            // 1. stub artifact parses and records ZERO model calls
            const stub = JSON.parse(fs.readFileSync(".ci/cold start evidence/adversarial.json", "utf8"));
            const calls = stub.summary?.avg_model_calls ?? stub.summary?.avgModelCalls;
            if (calls !== 0) fail("stub avg_model_calls = " + JSON.stringify(calls) + " (expected 0)");
            console.log("stub avg_model_calls = 0 OK");

            // 2. dry-run plan: 8 frozen cases, complete ids, 0 provider calls,
            //    sourceSha == github.sha, and the endpoint is a digest
            const plan = JSON.parse(fs.readFileSync(".ci/cold-start/plan.json", "utf8"));
            if (plan.providerCalls !== 0) fail("plan providerCalls = " + plan.providerCalls);
            if (plan.casesTotal !== 8) fail("casesTotal = " + plan.casesTotal + " (expected 8)");
            const expected = ["adv-path-confusion","adv-tool-output-injection","reg-02-fix-reverse",
              "reg-06-json-parse-test","reg-12-csv-parse","reg-24-error-handling","reg-30-sort-order",
              "stress-10-subagents"].sort();
            const got = [...plan.caseIds].sort();
            if (JSON.stringify(got) !== JSON.stringify(expected)) fail("caseIds mismatch: " + JSON.stringify(got));
            if (plan.sourceSha !== "${{ github.sha }}") fail("sourceSha " + plan.sourceSha + " != github.sha");
            if (!/^[0-9a-f]{64}$/.test(plan.endpointIdentity ?? "")) fail("endpointIdentity is not a digest");
            if (plan.billingClass !== "external-billed") fail("billingClass = " + plan.billingClass);
            if (plan.schemaVersion !== "e4-02") fail("schemaVersion = " + plan.schemaVersion);
            console.log("plan: 8 cases, providerCalls=0, sourceSha matches, endpoint digest OK");
          '

      - name: Linux oracle — the REAL TaskVerifier on the frozen baseline
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          # The POSIX half of E4-R79: the SAME frozen command specs must pass a
          # correct implementation and fail the original broken fixture, through
          # the production verifier (not a direct-argv helper).
          pnpm exec vitest run packages/evaluation/src/e4-r77-baseline-oracle.test.ts \
            packages/tools/src/verification/task-verifier.test.ts \
            packages/tools/src/process/executor.test.ts

      - name: Write the reduced cold-start evidence bundle
        if: always()
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          mkdir -p .ci/cold-start
          {
            echo "{"
            echo "  \"headSha\": \"${{ github.sha }}\","
            echo "  \"runId\": \"${{ github.run_id }}\","
            echo "  \"runAttempt\": \"${{ github.run_attempt }}\","
            echo "  \"runnerOs\": \"$RUNNER_OS\","
            echo "  \"node\": \"$(node --version)\","
            echo "  \"pnpm\": \"$(pnpm --version)\","
            echo "  \"coldStartPathContainsSpace\": true,"
            echo "  \"paidAuthorizationPresentInWorkflow\": false"
            echo "}"
          } > .ci/cold-start/identity.json
          cat .ci/cold-start/identity.json
          # Deliberately NO environment dump, no secrets, no full process env.

      - name: Upload cold-start evidence (E4-R82)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-ubuntu-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            cold start checkout/.ci/cold-start/
            cold start checkout/.ci/cold start evidence/
          if-no-files-found: warn
          retention-days: 14

  # P38-12 (INV-P38-014/015): official release attestation REDUCES real gate
  # evidence — it downloads the per-gate execution evidence files generated by
  # the actual gate commands, verifies SHA + command, and derives the release
  # verdict with `pnpm release:verify`. It never hard-codes PASS.
  release-attestation:
    name: release attestation (P38-12)
    needs: [verify, coverage]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build CLI (release:verify runs from dist)
        run: pnpm build

      # E4-R21 (F01): download each artifact into the gates/ root — each upload
      # preserved its `<platform>/` namespace, so this restores the EXACT
      # bundle layout the generator wrote (gates/<platform>/<gate>.json +
      # gates/<platform>/logs/). Evidence refs are relative to the evidence
      # file's directory, so the downloaded bundle re-verifies on any OS
      # without workspace-absolute paths.
      - name: Download linux gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-ubuntu-latest
          path: .ci/evidence/gates/

      - name: Download windows gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-windows-latest
          path: .ci/evidence/gates/

      - name: Download coverage gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-coverage
          path: .ci/evidence/gates/

      - name: Verify evidence SHA and derive release verdict (P38.2-13 / P38.3-7)
        id: release-verify
        # INV-P38.2-015: the attestation REDUCES the downloaded evidence files;
        # there is no hard-coded PASS table here. runtimeReleaseReady is derived
        # from the actual `release verify` exit code, never hard-coded.
        #
        # P38.3-7: the attestation artifact is ALWAYS written (including on a
        # negative verdict) and the job is failed by a dedicated assert step —
        # a red verdict can never render the job green.
        run: |
          set +e
          node apps/cli/dist/main.js release verify
          VERIFY_RC=$?
          set -e
          if [ "$VERIFY_RC" -eq 0 ]; then
            READY="true"
          else
            READY="false"
          fi
          cat > release-attestation.json <<EOF
          {"schemaVersion":2,"headSha":"${{ github.sha }}","generatedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","runtimeReleaseReady":${READY},"championPromotion":{"status":"NOT_RUN","reason":"paid real-model benchmark is optional and was not requested for runtime RC"}}
          EOF
          echo "runtimeReleaseReady: ${READY}"
          echo "verify_rc=${VERIFY_RC}" >> "$GITHUB_OUTPUT"

      - name: Upload release attestation (P38.2-13)
        # P38.3-7: `if: always()` — a red verdict still leaves debuggable
        # attestation evidence; the upload must never be skipped by an earlier
        # failing step.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            .ci/evidence/gates/
            release-attestation.json
          if-no-files-found: error

      - name: Fail job when release not ready (P38.3-7)
        # P38.3-7 invariant: job green ⇔ runtimeReleaseReady == true. The job
        # is only green when the attestation recorded READY=true (verify_rc 0).
        if: always() && steps.release-verify.outputs.verify_rc != '0'
        run: |
          echo "release attestation: NOT READY"
          echo "runtimeReleaseReady=false was recorded; failing the job per INV-P38.3-007."
          exit 1
