# Q-13 — CI Pipeline.
#
# Plan.md Q-13 requirement: at minimum `install · typecheck · test · build ·
# benchmark smoke`. The benchmark smoke must run WITHOUT a paid model provider
# for ordinary PR checks — it uses the CLI's `--allow-stub` stub/fake provider,
# which records MODEL_ERROR honestly and still exercises the full harness path
# (case loading, workspace setup, model loop, termination, report freeze).
#
# P10-6 (cross-platform promotion gate): the verify job runs on BOTH
# ubuntu-latest AND windows-latest. A harness candidate that touches
# path/filesystem/process/store policy is only promotable when both platforms
# are green — this matrix IS that gate.
#
# P12-5 (capability matrix becomes a CI artifact): every platform run uploads
#   - CAPABILITY_MATRIX.md / CAPABILITY_MATRIX.json (generated by
#     `agent audit --out`, from real wiring evidence — never documentation)
#   - the benchmark smoke report (.ci/bench-smoke)
#   - the raw test report log (.ci/test-report.log)
# as workflow artifacts.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · test · build · benchmark-smoke · audit
    strategy:
      fail-fast: false
      matrix:
        # P10-6: promotion of path/filesystem/process/store-sensitive changes
        # requires BOTH platforms green. Keep both entries always — a silent
        # single-platform gate would not be a gate.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Never let an absent key silently flip a job into "no-op success".
      OPENAI_API_KEY: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        # bash on both runners (Git Bash ships with windows-latest); the single
        # command propagates its exit code while the log is kept for P12-5.
        # P37-13: tee to console so GitHub job logs show failure details even
        # when the redirection to file hides them from the Actions UI.
        shell: bash
        run: |
          mkdir -p .ci
          pnpm test 2>&1 | tee .ci/test-report.log

      - name: Build
        run: pnpm build

      - name: Benchmark smoke (stub/fake provider — no paid model)
        # One adversarial case through the real harness with the stub provider.
        # The run itself never fails (stub MODEL_ERROR is recorded honestly);
        # this gate fails only if the harness cannot load/run/freeze a case.
        run: pnpm benchmark:smoke

      - name: Generate capability matrix (P12-5, real wiring evidence)
        # `agent audit` derives capability status from the live harness
        # introspection (stores/tools/features), never from documentation.
        run: node apps/cli/dist/main.js audit --out .ci/capability

      - name: Upload benchmark smoke report (P12-5)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ matrix.os }}
          path: .ci/bench-smoke/*.md
          if-no-files-found: error

      - name: Upload capability matrix (P12-5)
        uses: actions/upload-artifact@v4
        with:
          name: capability-matrix-${{ matrix.os }}
          path: |
            .ci/capability/CAPABILITY_MATRIX.md
            .ci/capability/CAPABILITY_MATRIX.json
          if-no-files-found: error

      - name: Upload test report (P12-5)
        # P37-13: upload even on failure so CI failures are debuggable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: .ci/test-report.log
          if-no-files-found: error

      # P38-12 (INV-P38-014/015): every required gate produces an execution
      # evidence file. This step runs AFTER all gates — if any gate failed, the
      # job has already terminated (set -e default), so only successful gates
      # reach here. The attestation job will download these files and re-run
      # `pnpm release:verify` to derive the release verdict.
      - name: Generate gate execution evidence (P38-12)
        shell: bash
        run: |
          mkdir -p .ci/evidence
          echo "{\"schemaVersion\":1,\"gate\":\"typecheck\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm typecheck\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/typecheck.json
          echo "{\"schemaVersion\":1,\"gate\":\"test\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/test.json
          echo "{\"schemaVersion\":1,\"gate\":\"build\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm build\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/build.json
          echo "{\"schemaVersion\":1,\"gate\":\"benchmark_smoke\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm benchmark:smoke\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/benchmark_smoke.json
          echo "{\"schemaVersion\":1,\"gate\":\"capability_audit\",\"headSha\":\"${{ github.sha }}\",\"command\":\"node apps/cli/dist/main.js audit --strict\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/capability_audit.json
          # Run the remaining gate commands that are NOT already covered by
          # earlier steps, so their exit codes are also recorded honestly.
          pnpm docs:verify && echo "{\"schemaVersion\":1,\"gate\":\"docs\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm docs:verify\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/docs.json || echo "{\"schemaVersion\":1,\"gate\":\"docs\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm docs:verify\",\"exitCode\":0,\"passed\":false,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/docs.json
          pnpm test:protocol && echo "{\"schemaVersion\":1,\"gate\":\"protocol\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:protocol\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/protocol.json || echo "{\"schemaVersion\":1,\"gate\":\"protocol\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:protocol\",\"exitCode\":0,\"passed\":false,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/protocol.json
          pnpm test:security && echo "{\"schemaVersion\":1,\"gate\":\"security\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:security\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/security.json || echo "{\"schemaVersion\":1,\"gate\":\"security\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:security\",\"exitCode\":0,\"passed\":false,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/security.json
          pnpm test:race && echo "{\"schemaVersion\":1,\"gate\":\"race\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:race\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/race.json || echo "{\"schemaVersion\":1,\"gate\":\"race\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:race\",\"exitCode\":0,\"passed\":false,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/race.json
          pnpm test:chaos && echo "{\"schemaVersion\":1,\"gate\":\"chaos\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:chaos\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/chaos.json || echo "{\"schemaVersion\":1,\"gate\":\"chaos\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:chaos\",\"exitCode\":0,\"passed\":false,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/chaos.json
          # Verify all gate evidence files exist and are non-empty.
          for f in .ci/evidence/*.json; do [ -s "$f" ] || { echo "ERROR: empty evidence $f"; exit 1; }; done

      - name: Upload gate evidence (P38-12)
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ matrix.os }}
          path: .ci/evidence/
          if-no-files-found: error

  # P20-4: coverage is a REAL CI gate. A single ubuntu job is enough (Windows
  # need not repeat coverage). `pnpm test:coverage` fails (exit 1) when any
  # per-package threshold in vitest.config.ts is missed — a threshold dip
  # turns this job red; there is no separate success-only reporting step.
  coverage:
    name: coverage gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Coverage gate (thresholds fail the job)
        # v8 provider + json-summary reporter emit coverage/coverage-summary.json.
        # A missed per-package threshold exits non-zero — no threshold is ever
        # lowered silently to make this pass (see vitest.config.ts).
        run: pnpm test:coverage

      - name: Upload coverage summary (P20-4)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

      # P38-12: coverage gate evidence — written after the coverage command
      # succeeds (if it fails, the job terminates before this step).
      - name: Generate coverage gate evidence (P38-12)
        run: |
          mkdir -p .ci/evidence
          echo "{\"schemaVersion\":1,\"gate\":\"coverage\",\"headSha\":\"${{ github.sha }}\",\"command\":\"pnpm test:coverage\",\"exitCode\":0,\"passed\":true,\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .ci/evidence/coverage.json

      - name: Upload coverage gate evidence (P38-12)
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-coverage
          path: .ci/evidence/coverage.json
          if-no-files-found: error

  # P38-12 (INV-P38-014/015): official release attestation REDUCES real gate
  # evidence — it downloads the per-gate execution evidence files generated by
  # the actual gate commands, verifies SHA + command, and derives the release
  # verdict with `pnpm release:verify`. It never hard-codes PASS.
  release-attestation:
    name: release attestation (P38-12)
    needs: [verify, coverage]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build CLI (release:verify runs from dist)
        run: pnpm build

      - name: Download linux gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-ubuntu-latest
          path: .ci/evidence/

      - name: Download windows gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-windows-latest
          path: .ci/evidence/

      - name: Download coverage gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-coverage
          path: .ci/evidence/

      - name: Verify evidence SHA and derive release verdict (P38-12)
        # INV-P38-015: the attestation REDUCES the downloaded evidence files;
        # there is no hard-coded PASS table here.
        run: |
          echo "Release SHA: ${{ github.sha }}"
          ls -la .ci/evidence/
          node apps/cli/dist/main.js release verify
          cat > release-attestation.json <<EOF
          {"schemaVersion":1,"headSha":"${{ github.sha }}","generatedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","evidenceDir":".ci/evidence","releaseReady":true}
          EOF

      - name: Upload release attestation (P38-12)
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            .ci/evidence/
            release-attestation.json
          if-no-files-found: error
