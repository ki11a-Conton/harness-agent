# Q-13 — CI Pipeline.
#
# Plan.md Q-13 requirement: at minimum `install · typecheck · test · build ·
# benchmark smoke`. The benchmark smoke must run WITHOUT a paid model provider
# for ordinary PR checks — it uses the CLI's `--allow-stub` stub/fake provider,
# which records MODEL_ERROR honestly and still exercises the full harness path
# (case loading, workspace setup, model loop, termination, report freeze).
#
# P10-6 (cross-platform promotion gate): the verify job runs on BOTH
# ubuntu-latest AND windows-latest. A harness candidate that touches
# path/filesystem/process/store policy is only promotable when both platforms
# are green — this matrix IS that gate.
#
# P12-5 (capability matrix becomes a CI artifact): every platform run uploads
#   - CAPABILITY_MATRIX.md / CAPABILITY_MATRIX.json (generated by
#     `agent audit --out`, from real wiring evidence — never documentation)
#   - the benchmark smoke report (.ci/bench-smoke)
#   - the raw test report log (.ci/test-report.log)
# as workflow artifacts.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · typecheck · test · build · benchmark-smoke · audit
    strategy:
      fail-fast: false
      matrix:
        # P10-6: promotion of path/filesystem/process/store-sensitive changes
        # requires BOTH platforms green. Keep both entries always — a silent
        # single-platform gate would not be a gate.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Never let an absent key silently flip a job into "no-op success".
      OPENAI_API_KEY: ""
      # E4-R24 (F03/F04): NAME this suite run and point committed observation
      # evidence into the workspace. The suite then runs under the final-result
      # reporter, which publishes committed (`runStatus: passed`) rows ONLY from
      # the framework's final test states (assertions + afterEach/afterAll).
      # A failed test leaves no passed rows behind, and a rerun writes to its
      # OWN run file — an old green run can never mask a current failure. The
      # INDEPENDENT strict audit below reads exactly this run.
      E2E_OBSERVATION_EVIDENCE_DIR: .ci/observation-evidence
      E2E_OBSERVATION_RUN_ID: e4-r24-${{ matrix.os }}-${{ github.run_id }}
      # E4-R40 (K01): where a FAILED e4-09 run drops its attribution bundle.
      # Recorded relative to the repo root (CI cwd); `.ci/` is git-ignored so
      # this never dirties the working tree the sentinel inspects.
      E4_09_DIAG_DIR: .ci/diagnostics
      # E4-R60 (G60): where the R55 PARENT VERIFIER drops the logs, raw report
      # and diagnostic bundle tree of a child run it judged UNDECIDABLE. The
      # parent preserves this BEFORE releasing the run's temp roots, so it is
      # separate from (and additional to) the e4-09 hook above. Also `.ci/`,
      # for the same clean-tree reason.
      E4_R55_PARENT_DIAG_DIR: .ci/r55-parent-diagnostics
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        # bash on both runners (Git Bash ships with windows-latest); the single
        # command propagates its exit code while the log is kept for P12-5.
        # P37-13: tee to console so GitHub job logs show failure details even
        # when the redirection to file hides them from the Actions UI.
        shell: bash
        run: |
          mkdir -p .ci
          pnpm test 2>&1 | tee .ci/test-report.log

      - name: Build
        run: pnpm build

      # E4-R24 (F03/F04): independent STRICT usage audit over the suite's named
      # run. The strict verdict is rendered by its own process AFTER the final
      # results are committed — a test never writes its own success and then
      # asserts on it in the same body. --strict WITHOUT --run fails by design
      # (no global-history fallback); here the run IS named, so the only way
      # this step passes is: the framework's final results + committed rows +
      # exact testedSourceSha match + testName declared in the test file source.
      # A red audit fails the job — a green test gate alone cannot certify
      # release-grade observation.
      - name: Strict usage audit of the named run (E4-R24 independent stage)
        shell: bash
        run: |
          mkdir -p .ci/observation-evidence
          node apps/cli/dist/main.js usage-audit --run "$E2E_OBSERVATION_RUN_ID" --strict

      - name: Upload observation evidence (E4-R24)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-evidence-${{ matrix.os }}-${{ github.run_id }}
          path: .ci/observation-evidence/
          if-no-files-found: warn

      - name: Benchmark smoke (stub/fake provider — no paid model)
        # One adversarial case through the real harness with the stub provider.
        # The run itself never fails (stub MODEL_ERROR is recorded honestly);
        # this gate fails only if the harness cannot load/run/freeze a case.
        run: pnpm benchmark:smoke

      - name: Upload benchmark smoke report (P12-5)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ matrix.os }}
          path: .ci/bench-smoke/*.md
          if-no-files-found: error

      # E4-R84: the campaign-level evidence chain, validated on BOTH platforms
      # from a fully SYNTHETIC committed fixture. The operator's real R83
      # campaign stays on their own machine (it is git-ignored and is never
      # uploaded); CI proves the VALIDATOR is deterministic and
      # cross-platform, not that a particular paid run happened.
      - name: Campaign evidence chain — synthetic fixture validates (E4-R84)
        shell: pwsh
        run: |
          # E4-R84: GitHub Actions wraps every `shell: pwsh` step as
          #   $ErrorActionPreference = 'stop'  <script>  exit $LASTEXITCODE
          # This step's whole point is to run validations that MUST exit
          # non-zero, so without care the wrapper would inherit the last
          # deliberate failure and fail the job even though every assertion
          # passed (observed: exit 1 on both platforms with all checks OK).
          # Fixes, both required:
          #   1. check $LASTEXITCODE explicitly after each native command, so a
          #      real failure is caught HERE rather than being masked later;
          #   2. end with an explicit `exit 0` — a `throw` above still aborts
          #      first, so real failures are never swallowed.
          $ErrorActionPreference = 'stop'

          # 1. The fixture must match its committed generator byte-for-byte, so
          #    it cannot have been hand-tuned to satisfy the validator.
          pnpm benchmark:campaign:fixture-check
          if ($LASTEXITCODE -ne 0) { throw "fixture check failed (exit $LASTEXITCODE)" }
          # 2. The committed fixture must validate, with the exact numbers the
          #    generator put in it.
          pnpm benchmark:campaign:validate
          if ($LASTEXITCODE -ne 0) { throw "fixture campaign did not validate (exit $LASTEXITCODE)" }
          # 3. The SAME run must be reproducible: validate twice, same digest.
          #    (2>$null: the harness prints an advisory context-budget note on
          #    stderr; --json output on stdout must stay parseable.)
          $first = (node apps/cli/dist/main.js benchmark campaign validate `
            scripts/benchmark/fixtures/r84-campaign/campaign `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --json 2>$null) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "the --json validation failed (exit $LASTEXITCODE)" }
          $second = (node apps/cli/dist/main.js benchmark campaign validate `
            scripts/benchmark/fixtures/r84-campaign/campaign `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --json 2>$null) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "the second --json validation failed (exit $LASTEXITCODE)" }
          # Guard the comparisons below against a vacuous pass: two nulls would
          # compare equal and a missing summary would satisfy nothing.
          if ($null -eq $first -or $null -eq $second) {
            throw "--json produced no parseable object (first=$($null -eq $first) second=$($null -eq $second))"
          }
          if ([string]::IsNullOrEmpty($first.rootDigest)) { throw "--json carried no rootDigest" }
          if ($first.rootDigest -ne $second.rootDigest) {
            throw "campaign root digest is not deterministic: $($first.rootDigest) vs $($second.rootDigest)"
          }
          if ($first.summary.passed -ne 1 -or $first.summary.processRunSuccesses -ne 3) {
            throw "fixture summary drifted: passed=$($first.summary.passed) processRunSuccesses=$($first.summary.processRunSuccesses)"
          }
          Write-Host "E4-R84 fixture digest (deterministic): $($first.rootDigest)"
          # 4. Tamper detection: one changed byte must FAIL the campaign.
          #    The recorded evidence manifest is what makes this DETECTING
          #    rather than merely evident: the recorded per-file hashes are
          #    compared against what is on disk now.
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          Copy-Item -Recurse -Force scripts/benchmark/fixtures/r84-campaign/campaign .ci/r84-tamper
          if (-not (Test-Path .ci/r84-tamper/results/stress/syn-str-1/stress.json)) {
            throw "the tamper copy did not materialise — the rest of this step would be meaningless"
          }
          node apps/cli/dist/main.js benchmark campaign validate .ci/r84-tamper `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --emit-evidence .ci/r84-fixture-evidence.json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not emit the fixture evidence manifest" }
          $target = ".ci/r84-tamper/results/stress/syn-str-1/stress.json"
          $original = Get-Content $target -Raw
          $tampered = $original.Replace('"model_calls": 9', '"model_calls": 10')
          # If the needle ever stops matching, the Replace is a silent no-op and
          # the "tamper detected" assertion below would pass for the wrong
          # reason. Assert the mutation really happened first.
          if ($tampered -eq $original) { throw "the tamper mutation did not apply — needle not found in $target" }
          Set-Content $target -Value $tampered -NoNewline
          node apps/cli/dist/main.js benchmark campaign validate .ci/r84-tamper `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --evidence .ci/r84-fixture-evidence.json
          if ($LASTEXITCODE -eq 0) { throw "a tampered campaign validated — tamper detection is broken" }
          Write-Host "E4-R84 tamper detection OK (tampered campaign rejected, exit $LASTEXITCODE)"
          # 4b. An ADDED file must also fail.
          Set-Content .ci/r84-tamper/results/stress/syn-str-1/injected.log "x"
          node apps/cli/dist/main.js benchmark campaign validate .ci/r84-tamper `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress --evidence .ci/r84-fixture-evidence.json
          if ($LASTEXITCODE -eq 0) { throw "an injected evidence file validated — tamper detection is broken" }
          Write-Host "E4-R84 injected-file detection OK (exit $LASTEXITCODE)"
          # 5. A summary-only tree (no raw reports) must FAIL closed.
          New-Item -ItemType Directory -Force -Path .ci/r84-summary-only | Out-Null
          Copy-Item scripts/benchmark/fixtures/r84-campaign/campaign/campaign-summary.json .ci/r84-summary-only/
          node apps/cli/dist/main.js benchmark campaign validate .ci/r84-summary-only `
            --cases scripts/benchmark/fixtures/r84-campaign/cases `
            --suites adversarial,stress
          if ($LASTEXITCODE -eq 0) { throw "a summary-only tree validated — the validator is not fail-closed" }
          Write-Host "E4-R84 summary-only tree rejected OK (exit $LASTEXITCODE)"

          # See the header note: the deliberate failures above are the point of
          # this step, so the step's own exit status must be set explicitly.
          # Every assertion reaching this line passed.
          exit 0

      # E4-R84: the runner's own control flow (stage -> dry-run -> digest ->
      # persist -> resume-skip -> validate), offline, 0 provider calls.
      # Windows-only: it drives the PowerShell runner that produced the real
      # campaign, and its -DryRunOnly path is the free half of that runner.
      - name: Campaign runner self-check — offline, 0 provider calls (E4-R84)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/benchmark/selfcheck-campaign-runner.ps1

      - name: Upload campaign evidence fixture report (E4-R84)
        uses: actions/upload-artifact@v4
        with:
          name: campaign-evidence-${{ matrix.os }}
          path: docs/evidence/e4-r83-campaign-manifest.json
          if-no-files-found: error

      - name: Upload test report (P12-5)
        # P37-13: upload even on failure so CI failures are debuggable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: .ci/test-report.log
          if-no-files-found: error

      # E4-R40 (K01) / E4-R46: when a test fails, upload the attribution bundles
      # the e4-09 diagnostic recorder wrote BEFORE its temp roots were cleaned
      # (identity/HEAD/cleanliness, real V3+paired+decision bytes with reduced
      # summaries, the real gate child exit/stderr, the benchmark's own CLI
      # exit+output). A green run writes nothing and uploads nothing, so this
      # step only ever fires on a genuinely failing run.
      # E4-R46: artifact name carries `-attempt-${{ github.run_attempt }}` so a
      # retry of a failing run in GitHub Actions cannot clash or overwrite the
      # previous attempt's diagnostic artifact.
      - name: Upload e4-09 diagnostic bundles (E4-R40, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e4-09-diagnostics-${{ matrix.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .ci/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # E4-R60 (G60): the R55 parent verifier preserves the child's bounded
      # stdout/stderr, its raw report, its diagnostic bundle tree and a
      # machine-readable run.json with every judgement reason BEFORE it releases
      # the run's temp roots. Uploading it here means a failed parent
      # verification is debuggable from the artifact alone — it no longer
      # depends on the e4-09 hook above, which only covers the e4-09 suite's own
      # failures. A green run preserves nothing and uploads nothing.
      - name: Upload R55 parent-verifier diagnostics (E4-R60, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e4-r55-parent-diagnostics-${{ matrix.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .ci/r55-parent-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # P38.2-4 (INV-P38.2-004): every attempted gate emits truthful evidence
      # from its REAL exit code. E4-R09 (F19): the evidence is produced by the
      # SAME production GateEvidenceV2 generator the verifier/collector consume
      # (`release gate` -> runGateV2) — never hand-written schemaVersion=1 JSON.
      # Each `release gate` runs the canonical GATE_COMMANDS command, binds git
      # state before/after + real exit code + digests, and writes DURABLE V2
      # evidence before returning; a red gate propagates its own exit code.
      # P38.2-10: evidence is namespaced per OS (linux/ windows).
      - name: Generate gate execution evidence (P38.2-4/10, E4-R09 unified V2)
        shell: bash
        run: |
          OS=$(case "${{ matrix.os }}" in *windows*) echo windows;; *) echo linux;; esac)
          EVID=".ci/evidence/gates/$OS"
          mkdir -p "$EVID"
          rc=0
          for gate in typecheck test build benchmark_smoke capability_audit docs protocol security race chaos; do
            ERR="$EVID/$gate.stderr"
            # E4-R09: duplicate the gate output into a file; every red gate also
            # emits a ::error:: workflow annotation naming the gate + its last
            # output lines, so CI annotations name the failing gate without
            # needing full log access.
            if ! node apps/cli/dist/main.js release gate "$gate" --evidence-dir "$EVID" >"$ERR" 2>&1; then
              rc=1
              # Annotate the FAILING lines (not just the tail): docs/audit gates
              # print their failing check near the top/middle of the output.
              grep -niE "fail|error|✗|inconsistent|missing|expected" "$ERR" | head -n 30 | while IFS= read -r l; do echo "::error file=${GITHUB_WORKFLOW:-ci.yml},title=release gate $gate failed::$l"; done
            fi
          done
          # Every attempted gate's evidence is durable (the generator wrote it
          # before returning); fail with the first red gate's rc semantics.
          for f in "$EVID"/*.json; do
            [ -s "$f" ] || { echo "ERROR: empty evidence $f"; rc=1; }
          done
          exit $rc

      # P38.2-11: the AUTHORITATIVE capability matrix is generated AFTER the
      # gate evidence exists — `audit` synthesizes capability test_run evidence
      # from the passing `test` gate + the reviewed manifest (P38.2-5/11), so
      # the artifact carries real integrationTested status at the immutable
      # github.sha, not an evidence-less snapshot.
      - name: Generate capability matrix (P12-5, P38.2-11 real wiring evidence)
        run: node apps/cli/dist/main.js audit --out .ci/capability

      - name: Upload capability matrix (P12-5, P38.2-11)
        uses: actions/upload-artifact@v4
        with:
          # P38.2-11 (INV-P38.2-011): the CI artifact is the AUTHORITATIVE
          # capability record, bound to the immutable github.sha. The tracked
          # repository snapshot is informational only (marked NOT RELEASE
          # EVIDENCE) and must never be treated as release attestation.
          name: capability-matrix-${{ github.sha }}-${{ matrix.os }}
          path: |
            .ci/capability/CAPABILITY_MATRIX.md
            .ci/capability/CAPABILITY_MATRIX.json
          if-no-files-found: error

      - name: Upload gate evidence (P38.2-10)
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ matrix.os }}
          path: .ci/evidence/gates/
          if-no-files-found: error

  # P20-4: coverage is a REAL CI gate. A single ubuntu job is enough (Windows
  # need not repeat coverage). `pnpm test:coverage` fails (exit 1) when any
  # per-package threshold in vitest.config.ts is missed — a threshold dip
  # turns this job red; there is no separate success-only reporting step.
  coverage:
    name: coverage gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Coverage gate (thresholds fail the job)
        # v8 provider + json-summary reporter emit coverage/coverage-summary.json.
        # A missed per-package threshold exits non-zero — no threshold is ever
        # lowered silently to make this pass (see vitest.config.ts).
        # E4-R57 (G57): the entry itself runs `tsc -b` first. The gate-isolation
        # suite treats apps/cli/dist + node_modules/.cache/tsbuildinfo as REQUIRED
        # protected resources, so a clean checkout (install, no build) produced an
        # invalid "before" snapshot (ENOENT on both). The build lives in the
        # `test:coverage` script — not in a duplicated step here — so this job,
        # the `release gate coverage` CLI (release-verify.ts maps the gate to the
        # same command) and the documented local entry cannot drift apart.
        run: pnpm test:coverage

      - name: Upload coverage summary (P20-4)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

      # P38-12 + E4-R09 (F19): coverage gate evidence via the SAME V2 generator
      # (runs the canonical `pnpm test:coverage`, binds real exit + git state +
      # digests, writes to gates/coverage/ matching the attestation layout).
      - name: Generate coverage gate evidence (P38-12, E4-R09 V2)
        run: |
          node apps/cli/dist/main.js release gate coverage --evidence-dir .ci/evidence/gates/coverage

      - name: Upload coverage gate evidence (P38-12)
        uses: actions/upload-artifact@v4
        with:
          # E4-R21 (F01): upload from the gates/ root so the artifact keeps the
          # `coverage/` namespace — the attestation job then restores the exact
          # gates/<platform>/ bundle layout the evidence refs are relative to
          # (logRef paths are relative to the evidence file's directory).
          name: gate-evidence-coverage
          path: .ci/evidence/gates/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # E4-R82 (F82-1): offline Linux cold-start.
  #
  # The frozen-baseline handoff was only ever validated on the author's Windows
  # machine; the repo had no job that walks the README's cold-start path on
  # Linux, so the POSIX half of the command verifier was unproven. The author has
  # no Linux, WSL or Docker, so this evidence is produced HERE, on GitHub's
  # ubuntu-latest, and is labelled as such — never passed off as the author's
  # machine.
  #
  # Hard constraints, per the plan:
  #   - no secrets are configured and none are read;
  #   - RUN_PAID_BENCHMARKS is never set, so a paid run is structurally
  #     impossible;
  #   - every check asserts providerCalls = 0 and a stub/fake provider, so no
  #     real model is ever contacted;
  #   - the checkout is a REAL cold start in a path containing a space, and it
  #     reuses nothing from the verify job's node_modules or dist.
  # ---------------------------------------------------------------------------
  cold-start-ubuntu:
    name: offline cold-start (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Belt and braces: even if a key leaked into the runner environment, the
      # paid switch stays off for this job.
      RUN_PAID_BENCHMARKS: ""
    steps:
      - name: Check out the repository (into a path containing a space)
        uses: actions/checkout@v4
        with:
          path: "cold start checkout"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22, the LTS line CI standardises on (not the author's local 24).
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "cold start checkout/pnpm-lock.yaml"

      - name: Assert the tested HEAD is the workflow SHA
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checked-out HEAD: $HEAD_SHA"
          echo "github.sha      : ${{ github.sha }}"
          test "$HEAD_SHA" = "${{ github.sha }}"

      - name: Assert this is a genuine cold start (no node_modules, no dist)
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          test ! -d node_modules || { echo "node_modules already present — not a cold start"; exit 1; }
          test ! -d apps/cli/dist || { echo "apps/cli/dist already present — not a cold start"; exit 1; }
          echo "cold start confirmed: no node_modules, no apps/cli/dist"

      - name: README step 1 — install (frozen lockfile)
        working-directory: "cold start checkout"
        run: pnpm install --frozen-lockfile

      - name: README step 2 — build
        working-directory: "cold start checkout"
        run: pnpm build

      - name: Verify the workflow itself cannot authorize a paid run
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          if grep -nE 'RUN_PAID_BENCHMARKS\s*[:=]\s*["'"'"']?1' .github/workflows/ci.yml; then
            echo "workflow file contains a paid authorization — refusing"; exit 1
          fi
          echo "no paid authorization in the workflow"

      - name: README step 3 — doctor
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          mkdir -p .ci/cold-start
          node apps/cli/dist/main.js doctor | tee .ci/cold-start/doctor.txt
          # Machine-check, not just exit 0: no doctor ERRORS may be reported.
          if grep -qiE '^\s*(error|ERROR)\b' .ci/cold-start/doctor.txt; then
            echo "doctor reported errors"; exit 1
          fi

      - name: README step 4 — single adversarial case with the stub provider
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          mkdir -p ".ci/cold start evidence"
          node apps/cli/dist/main.js benchmark \
            --suite adversarial --limit 1 --allow-stub \
            --out ".ci/cold start evidence" | tee .ci/cold-start/stub.txt

      - name: README step 5 — frozen baseline plan (dry-run, no key, 0 provider calls)
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          mkdir -p ".ci/cold start evidence"
          node apps/cli/dist/main.js benchmark \
            --suite regression \
            --cases benchmarks/baseline-e4-r74 \
            --provider openai \
            --model cold-start-model \
            --endpoint https://api.invalid.example/v1 \
            --limit 0 \
            --max-logical-runs 8 --max-model-calls 80 \
            --max-estimated-tokens 320000 --max-estimated-cost-usd 0.04 \
            --dry-run \
            --out ".ci/cold start evidence" > .ci/cold-start/plan.json
          cat .ci/cold-start/plan.json

      - name: Machine-check the artifacts (not just exit codes)
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const fail = (m) => { console.error("COLD-START CHECK FAILED: " + m); process.exit(1); };

            // 1. stub artifact parses and records ZERO model calls
            const stub = JSON.parse(fs.readFileSync(".ci/cold start evidence/adversarial.json", "utf8"));
            const calls = stub.summary?.avg_model_calls ?? stub.summary?.avgModelCalls;
            if (calls !== 0) fail("stub avg_model_calls = " + JSON.stringify(calls) + " (expected 0)");
            console.log("stub avg_model_calls = 0 OK");

            // 2. dry-run plan: 8 frozen cases, complete ids, 0 provider calls,
            //    sourceSha == github.sha, and the endpoint is a digest
            const plan = JSON.parse(fs.readFileSync(".ci/cold-start/plan.json", "utf8"));
            if (plan.providerCalls !== 0) fail("plan providerCalls = " + plan.providerCalls);
            if (plan.casesTotal !== 8) fail("casesTotal = " + plan.casesTotal + " (expected 8)");
            const expected = ["adv-path-confusion","adv-tool-output-injection","reg-02-fix-reverse",
              "reg-06-json-parse-test","reg-12-csv-parse","reg-24-error-handling","reg-30-sort-order",
              "stress-10-subagents"].sort();
            const got = [...plan.caseIds].sort();
            if (JSON.stringify(got) !== JSON.stringify(expected)) fail("caseIds mismatch: " + JSON.stringify(got));
            if (plan.sourceSha !== "${{ github.sha }}") fail("sourceSha " + plan.sourceSha + " != github.sha");
            if (!/^[0-9a-f]{64}$/.test(plan.endpointIdentity ?? "")) fail("endpointIdentity is not a digest");
            if (plan.billingClass !== "external-billed") fail("billingClass = " + plan.billingClass);
            if (plan.schemaVersion !== "e4-02") fail("schemaVersion = " + plan.schemaVersion);
            console.log("plan: 8 cases, providerCalls=0, sourceSha matches, endpoint digest OK");
          '

      - name: Linux oracle — the REAL TaskVerifier on the frozen baseline
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          # The POSIX half of E4-R79: the SAME frozen command specs must pass a
          # correct implementation and fail the original broken fixture, through
          # the production verifier (not a direct-argv helper).
          pnpm exec vitest run packages/evaluation/src/e4-r77-baseline-oracle.test.ts \
            packages/tools/src/verification/task-verifier.test.ts \
            packages/tools/src/process/executor.test.ts

      - name: Write the reduced cold-start evidence bundle
        if: always()
        working-directory: "cold start checkout"
        run: |
          set -euo pipefail
          mkdir -p .ci/cold-start
          {
            echo "{"
            echo "  \"headSha\": \"${{ github.sha }}\","
            echo "  \"runId\": \"${{ github.run_id }}\","
            echo "  \"runAttempt\": \"${{ github.run_attempt }}\","
            echo "  \"runnerOs\": \"$RUNNER_OS\","
            echo "  \"node\": \"$(node --version)\","
            echo "  \"pnpm\": \"$(pnpm --version)\","
            echo "  \"coldStartPathContainsSpace\": true,"
            echo "  \"paidAuthorizationPresentInWorkflow\": false"
            echo "}"
          } > .ci/cold-start/identity.json
          cat .ci/cold-start/identity.json
          # Deliberately NO environment dump, no secrets, no full process env.

      - name: Upload cold-start evidence (E4-R82)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-ubuntu-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            cold start checkout/.ci/cold-start/
            cold start checkout/.ci/cold start evidence/
          if-no-files-found: warn
          retention-days: 14

  # P38-12 (INV-P38-014/015): official release attestation REDUCES real gate
  # evidence — it downloads the per-gate execution evidence files generated by
  # the actual gate commands, verifies SHA + command, and derives the release
  # verdict with `pnpm release:verify`. It never hard-codes PASS.
  release-attestation:
    name: release attestation (P38-12)
    needs: [verify, coverage]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build CLI (release:verify runs from dist)
        run: pnpm build

      # E4-R21 (F01): download each artifact into the gates/ root — each upload
      # preserved its `<platform>/` namespace, so this restores the EXACT
      # bundle layout the generator wrote (gates/<platform>/<gate>.json +
      # gates/<platform>/logs/). Evidence refs are relative to the evidence
      # file's directory, so the downloaded bundle re-verifies on any OS
      # without workspace-absolute paths.
      - name: Download linux gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-ubuntu-latest
          path: .ci/evidence/gates/

      - name: Download windows gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-windows-latest
          path: .ci/evidence/gates/

      - name: Download coverage gate evidence
        uses: actions/download-artifact@v4
        with:
          name: gate-evidence-coverage
          path: .ci/evidence/gates/

      - name: Verify evidence SHA and derive release verdict (P38.2-13 / P38.3-7)
        id: release-verify
        # INV-P38.2-015: the attestation REDUCES the downloaded evidence files;
        # there is no hard-coded PASS table here. runtimeReleaseReady is derived
        # from the actual `release verify` exit code, never hard-coded.
        #
        # P38.3-7: the attestation artifact is ALWAYS written (including on a
        # negative verdict) and the job is failed by a dedicated assert step —
        # a red verdict can never render the job green.
        run: |
          set +e
          node apps/cli/dist/main.js release verify
          VERIFY_RC=$?
          set -e
          if [ "$VERIFY_RC" -eq 0 ]; then
            READY="true"
          else
            READY="false"
          fi
          cat > release-attestation.json <<EOF
          {"schemaVersion":2,"headSha":"${{ github.sha }}","generatedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","runtimeReleaseReady":${READY},"championPromotion":{"status":"NOT_RUN","reason":"paid real-model benchmark is optional and was not requested for runtime RC"}}
          EOF
          echo "runtimeReleaseReady: ${READY}"
          echo "verify_rc=${VERIFY_RC}" >> "$GITHUB_OUTPUT"

      - name: Upload release attestation (P38.2-13)
        # P38.3-7: `if: always()` — a red verdict still leaves debuggable
        # attestation evidence; the upload must never be skipped by an earlier
        # failing step.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            .ci/evidence/gates/
            release-attestation.json
          if-no-files-found: error

      - name: Fail job when release not ready (P38.3-7)
        # P38.3-7 invariant: job green ⇔ runtimeReleaseReady == true. The job
        # is only green when the attestation recorded READY=true (verify_rc 0).
        if: always() && steps.release-verify.outputs.verify_rc != '0'
        run: |
          echo "release attestation: NOT READY"
          echo "runtimeReleaseReady=false was recorded; failing the job per INV-P38.3-007."
          exit 1
