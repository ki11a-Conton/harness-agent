name: genuine Windows acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-acceptance.yml'
      - 'scripts/ci/windows-acceptance-report*'
      - 'packages/**'
      - 'apps/**'
      - 'scripts/research/source-audit-20261007/**'
      - 'scripts/research/coding-audit-20261007/**'
      - 'scripts/research/coding-prompts-20261008/**'
      - 'scripts/research/coding-tools-20261019/**'
      - 'scripts/research/managed-commands-20261025/**'
      - 'scripts/research/large-repo-20261027/**'
      - 'scripts/research/web-dsh-20261004/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vitest.config.ts'

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ''
      RUN_PAID_BENCHMARKS: ''
      E4_09_DIAG_DIR: .ci/windows-acceptance/diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frozen install and real build
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'frozen install failed' }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { throw 'typecheck failed' }
      - name: Check the acceptance report parser
        run: node --test scripts/ci/windows-acceptance-report.test.mjs scripts/research/managed-commands-20261025/observe-read-overlap.test.mjs scripts/research/coding-audit-20261007/web-startup-fixture.test.mjs
      - name: Bounded large-repository navigation (64 MiB V8 heap)
        run: |
          New-Item -ItemType Directory -Force .ci/windows-acceptance | Out-Null
          node scripts/research/large-repo-20261027/run.mjs . .ci/windows-acceptance/large-repo-probe.json
          if ($LASTEXITCODE -ne 0) { throw 'large-repository navigation probe failed' }
      - name: Real CLI and Web coding acceptance (scripted local HTTP)
        run: node scripts/research/coding-audit-20261007/acceptance.mjs .ci/windows-acceptance/coding
      - name: Opt-in coding prompt on actual CLI and Web HTTP requests
        run: node scripts/research/coding-prompts-20261008/acceptance.mjs .ci/windows-acceptance/coding-prompts coding-v1
      - name: Coding tool schemas and real CLI and Web execution
        run: node scripts/research/coding-tools-20261019/acceptance.mjs .ci/windows-acceptance/coding-tools
      - name: Managed command paired engineering protocol (48 actual arms, no paid calls)
        run: node scripts/research/managed-commands-20261025/paired.mjs .ci/windows-acceptance/managed-paired
      - name: Execute native process and production boundary regressions
        run: |
          New-Item -ItemType Directory -Force .ci/windows-acceptance | Out-Null
          pnpm exec vitest run packages/tools/src/managed-command-capacity.test.ts packages/tools/src/managed-commands.test.ts packages/tools/src/process/managed-output.test.ts packages/harness/src/managed-commands.integration.test.ts packages/harness/src/managed-command-config.test.ts apps/cli/src/managed-command-entry.integration.test.ts packages/sdk/src/managed-commands.integration.test.ts apps/web/src/deepseek/lease-fixture.regressions.test.ts packages/tools/src/batch-edit.regressions.test.ts packages/tools/src/scoped-repo-map.regressions.test.ts packages/harness/src/batch-edit.integration.test.ts apps/cli/src/data-dir-lease.test.ts apps/web/src/deepseek/coding-status.integration.test.ts apps/web/src/deepseek/coding-status-managed.regressions.test.ts packages/harness/src/context-wiring.integration.test.ts packages/evaluation/src/r97-claim-visibility.regressions.test.ts packages/evaluation/src/r97-budget-ledger.test.ts packages/evaluation/src/r97-claim-deadline.regressions.test.ts packages/evaluation/src/gen1-budget-lock-bounds.regressions.test.ts packages/evaluation/src/r97-claim-anchor-rename.test.ts apps/web/src/deepseek/legacy-model-switch.regressions.test.ts apps/cli/src/argv-launch.test.ts apps/cli/src/release-artifacts-gate-launch.test.ts packages/harness/src/session-model-selection.regressions.test.ts packages/harness/src/config-drift-create-session.test.ts packages/store-integrity/src/windows-atomic-write.regressions.test.ts packages/tools/src/process/executor.test.ts packages/tools/src/process/r96-windows-execution-boundary.test.ts packages/tools/src/process/windows-cancellation.regressions.test.ts packages/tools/src/verification/task-verifier.test.ts packages/tools/src/symbol-scope.regressions.test.ts packages/tools/src/indexed-source-reader.regressions.test.ts packages/tools/src/symbol-index-memory.regressions.test.ts packages/tools/src/symbol-index-concurrency.regressions.test.ts packages/tools/src/symbol-index-coverage.regressions.test.ts packages/tools/src/symbol-index-cancellation.regressions.test.ts packages/harness/src/large-index-coverage.integration.test.ts packages/context/src/scoped-instruction-read.regressions.test.ts packages/harness/src/source-audit-boundaries.regressions.test.ts packages/harness/src/source-audit-fixes.regressions.test.ts packages/harness/src/source-audit-memory.regressions.test.ts packages/harness/src/source-audit-recovery.regressions.test.ts apps/web/src/harness.integration.test.ts apps/web/src/source-audit-restoration.regressions.test.ts apps/cli/src/source-audit-verification.regressions.test.ts apps/cli/src/coding-host.regressions.test.ts packages/harness/src/coding-verification.regressions.test.ts packages/core/src/runtime/encoded-tool-output-security.regressions.test.ts packages/agents/src/coding-prompt.test.ts packages/harness/src/coding-prompt-policy.test.ts apps/cli/src/coding-prompt.integration.test.ts apps/cli/src/champion-application-p1.test.ts packages/core/src/runtime/final-continuation.regressions.test.ts packages/core/src/runtime/ask-user-callback.regressions.test.ts packages/core/src/runtime/final-parked-cancel.regressions.test.ts packages/tools/src/transaction-final.regressions.test.ts packages/harness/src/tool-event-security.regressions.test.ts apps/cli/src/final-question.regressions.test.ts apps/web/src/deepseek/change-compare.regressions.test.ts apps/web/src/deepseek/workspace.integration.test.ts apps/web/src/deepseek/session.test.ts apps/web/src/deepseek/session.production.test.ts apps/web/src/deepseek/owners.test.ts apps/web/src/deepseek/catalog.test.ts apps/web/src/deepseek/model-discovery-credentials.regressions.test.ts packages/tools/src/syntax-short-read.regressions.test.ts packages/model/src/openai-sse-framing.regressions.test.ts packages/core/src/runtime/terminal-outbox.regressions.test.ts packages/harness/src/terminal-outbox-durable.regressions.test.ts packages/core/src/runtime/terminal-observer-policy.regressions.test.ts apps/web/src/deepseek/terminal-observer-reentry.regressions.test.ts packages/gateway/src/transport-conformance.test.ts --reporter=default --reporter=json --outputFile=.ci/windows-acceptance/results.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression tests failed' }
      - name: Publish final-state receipt and all case records
        if: always()
        run: node scripts/ci/windows-acceptance-report.mjs .ci/windows-acceptance/results.json .ci/windows-acceptance/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .ci/windows-acceptance/
          if-no-files-found: error
