name: original Windows failure forensics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/current-windows-forensics.yml'
      - 'scripts/ci/current-windows-forensics.mjs'

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: '122360655884'
            run: '40552769979'
            source: '2ef3e90be6a0acc8820572d950ca279035805060'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the original failed job without rerunning its commands
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/current-windows-forensics.mjs '${{ matrix.job }}' '${{ matrix.run }}' '${{ matrix.source }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-windows-job-${{ matrix.job }}-${{ github.sha }}
          path: .ci/original-windows/
          if-no-files-found: error
