name: DeepSeek Windows failure forensics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deepseek-failure-forensics.yml'
      - 'scripts/ci/deepseek-failure-forensics.mjs'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: ui
            source: 65ec152c672682ff20f178df99e98eb6882f8f81
            run: '38343114931'
            artifact: deepseek-installed-windows-latest-65ec152c672682ff20f178df99e98eb6882f8f81-38343114931
          - kind: portable
            source: 4f7dcb551ec13885992e0099cf615ca9c3eaf049
            run: '38342742415'
            artifact: gen1-windows-latest-4f7dcb551ec13885992e0099cf615ca9c3eaf049-38342742415
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: ${{ matrix.artifact }}
          path: .ci/deepseek-failure
      - name: Report the bounded original failure details
        run: node scripts/ci/deepseek-failure-forensics.mjs .ci/deepseek-failure ${{ matrix.source }}
