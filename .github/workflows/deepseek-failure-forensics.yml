name: DeepSeek exact-source diagnostic export
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  receipts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: formal-ubuntu
            run: '38388121891'
            artifact: n6-real-formal-ubuntu-latest-b38566d5c370509db58cbb495aaf4eb68cbe3ce3-38388121891-attempt-1
          - kind: formal-windows
            run: '38388121891'
            artifact: n6-real-formal-windows-latest-b38566d5c370509db58cbb495aaf4eb68cbe3ce3-38388121891-attempt-1
          - kind: coverage
            run: '38388121891'
            artifact: gate-evidence-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: ${{ matrix.artifact }}
          path: .ci/original-artifact
      - name: Export existing original evidence
        run: node scripts/ci/deepseek-failure-forensics.mjs .ci/original-artifact b38566d5c370509db58cbb495aaf4eb68cbe3ce3
